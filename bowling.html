<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ストライク★パーティー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* 4人でワイワイ遊ぶパーティーゲーム風ボウリング。毎フレームのルーレットでレーンの条件が変わる。
   見た目: 夜のパーティー会場。紫のホール、旗飾り、すごろくのマスみたいな床、白フチの太い文字。 */
:root{
  --ink:#1d1640;--paper:#fff;--y:#ffd23f;--yd:#c99a00;--r:#ff4f6d;--rd:#c0263f;--b:#3d7bff;--bd:#2149b8;--g:#2ec27e;--gd:#178a55;--pu:#9b6bff;
  --disp:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#2a1d66;color:#fff;font-family:var(--body);font-weight:800;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}

/* ---- top HUD ---- */
.top{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) 12px 0;display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:5}
.row{display:flex;align-items:center;gap:8px;max-width:760px;width:100%;margin:0 auto}
.row .sp{flex:1}
.back,.tbtn{pointer-events:auto;color:#fff;text-decoration:none;font:inherit;font-size:12px;background:rgba(20,12,60,.6);border:2px solid rgba(255,255,255,.4);padding:4px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.back:hover,.tbtn:hover{background:rgba(20,12,60,.85)}
.back:focus-visible,.tbtn:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:760px;width:100%;margin:0 auto}
.chip{--c:#888;--cd:#555;display:flex;align-items:center;gap:5px;background:#fff;color:var(--ink);border-radius:14px;padding:3px 8px 3px 3px;border:3px solid var(--c);box-shadow:0 3px 0 var(--cd);min-width:0;transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s}
.chip.on{transform:translateY(-2px) scale(1.05);box-shadow:0 0 0 3px #fff,0 5px 0 var(--cd),0 0 20px var(--c)}
.chip svg{width:30px;height:33px;flex:none}
.chip .tx{min-width:0;display:flex;flex-direction:column;flex:1}
.chip .nm{font-size:10.5px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:3px}
.chip .you{font-size:8.5px;background:var(--r);color:#fff;border-radius:4px;padding:0 3px;line-height:1.4}
.chip .sc{font-family:var(--disp);font-weight:400;font-size:18px;line-height:1.05}
.chip .mk{font-size:9.5px;color:#6b6290;letter-spacing:.06em;white-space:nowrap;overflow:hidden;min-height:11px;line-height:1.15}
.sub{display:flex;justify-content:space-between;align-items:flex-start;max-width:760px;width:100%;margin:0 auto}
#badge{display:flex;align-items:center;gap:6px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:2px 12px 2px 4px;box-shadow:0 3px 0 var(--ink);font-size:12.5px}
#badge .ico{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;background:var(--bc,var(--pu))}
#badge .fr{color:#8a83ad;font-size:11px}
#mini{width:64px;height:58px;background:rgba(20,12,60,.6);border:2px solid rgba(255,255,255,.4);border-radius:12px}

/* ---- hero (current character) ---- */
#hero{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:calc(132px + env(safe-area-inset-bottom));z-index:4;pointer-events:none;display:flex;align-items:flex-end;gap:4px}
#hero .av{width:58px;height:64px;animation:bob 1.2s ease-in-out infinite;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
#hero .av svg{width:100%;height:100%}
#hero .say{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px 14px 14px 4px;padding:3px 9px;font-size:12px;margin-bottom:40px;max-width:150px;opacity:0;transform:scale(.6);transform-origin:left bottom;transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
#hero .say.on{opacity:1;transform:none}
#hero.yay .av{animation:yay .5s cubic-bezier(.3,1.6,.5,1) 3}
#hero.boo .av{animation:boo .45s ease-in-out 2}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes yay{0%,100%{transform:none}45%{transform:translateY(-26px) rotate(-8deg) scale(1.08)}}
@keyframes boo{25%{transform:translateX(-6px) rotate(-6deg)}75%{transform:translateX(6px) rotate(6deg)}}

/* ---- bottom panel ---- */
#panel{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(560px,calc(100% - 24px));background:#fff;color:var(--ink);border-radius:20px;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);padding:8px 14px 9px;z-index:5;pointer-events:none}
.steps{display:flex;gap:5px;justify-content:center}
.step{font-size:11px;padding:2px 9px;border-radius:999px;background:#ece8fb;color:#8a83ad;white-space:nowrap}
.step.on{background:var(--y);color:var(--ink);box-shadow:0 2px 0 var(--yd);animation:pulse .8s ease-in-out infinite}
.step.done{background:var(--g);color:#fff}
@keyframes pulse{50%{transform:scale(1.08)}}
.msg{text-align:center;font-size:14px;margin:5px 0 0;min-height:20px;line-height:1.4}
.msg small{font-size:11px;color:#8a83ad;font-weight:500}
.mwrap{margin-top:5px;visibility:hidden}
.mwrap.on{visibility:visible}
.meter{position:relative;height:20px;border-radius:10px;border:3px solid var(--ink);overflow:hidden}
.meter.pow{background:linear-gradient(90deg,#d7dcff 0 50%,#ffe27a 50% 78%,#4fdc8e 78% 90%,#ffa94d 90% 95%,#ff4f6d 95%)}
.meter.spin{background:linear-gradient(90deg,#4f8bff,#cfe0ff 44%,#fff 50%,#ffd0dc 56%,#ff4f6d)}
.meter.aim{background:repeating-linear-gradient(90deg,#efeaff 0 10%,#e1d9ff 10% 20%)}
.needle{position:absolute;top:-3px;bottom:-3px;left:50%;width:7px;margin-left:-3.5px;background:var(--ink);border-radius:3px;box-shadow:0 0 0 2px #fff}
.mlab{display:flex;justify-content:space-between;font-size:10.5px;color:#8a83ad;margin-top:2px;font-weight:500}
.mlab b{color:var(--gd);font-weight:800}

/* ---- banner ---- */
#banner{position:fixed;left:0;right:0;top:36%;text-align:center;pointer-events:none;z-index:7}
#banner .t{display:inline-block;font-family:var(--disp);font-weight:400;font-size:clamp(40px,11vw,92px);line-height:1.05;color:var(--y);-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink);animation:pop 1.5s cubic-bezier(.2,1.5,.4,1) both;padding:0 12px}
#banner .s{display:block;font-size:clamp(15px,3.6vw,22px);color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;margin-top:6px;animation:pop 1.5s cubic-bezier(.2,1.5,.4,1) .08s both}
#banner.long .t,#banner.long .s{animation-duration:2.2s}
@keyframes pop{0%{opacity:0;transform:scale(0) rotate(-14deg)}22%{opacity:1;transform:scale(1.18) rotate(3deg)}36%{transform:scale(.96) rotate(-1deg)}48%{transform:scale(1)}82%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.08) translateY(-18px)}}

/* ---- overlays ---- */
.ov{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(120% 90% at 50% 0%,rgba(122,70,216,.82),rgba(26,16,70,.92));overflow-y:auto;touch-action:pan-y}
.card{background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:20px 18px;width:min(560px,100%);text-align:center;margin:auto}
.logo{font-family:var(--disp);font-weight:400;font-size:clamp(24px,6.5vw,52px);line-height:1.1;margin:4px 0 6px;letter-spacing:.01em}
.logo span{display:inline-block;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink)}
.logo span:nth-child(odd){transform:rotate(-4deg)}
.logo span:nth-child(even){transform:rotate(4deg) translateY(2px)}
.lead{font-size:13px;color:#5e5585;font-weight:500;line-height:1.6;margin:0 0 14px}
.lbl{font-size:12px;color:#8a83ad;margin:14px 0 8px;letter-spacing:.08em}
.pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pc{font:inherit;background:#f4f1ff;border:3px solid #ddd5fb;border-radius:16px;padding:8px 4px 6px;cursor:pointer;color:var(--ink);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.pc svg{width:46px;height:51px;display:block;margin:0 auto}
.pc b{display:block;font-size:13px;margin-top:2px}
.pc small{display:block;font-size:9.5px;color:#8a83ad;font-weight:500;line-height:1.35;min-height:26px}
.pc[aria-pressed="true"]{background:#fff;border-color:var(--c);box-shadow:0 4px 0 var(--cd);transform:translateY(-3px)}
.pc:focus-visible,.seg button:focus-visible,.btn:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.seg{display:inline-flex;background:#f0ecff;border-radius:999px;padding:4px;gap:4px}
.seg button{font:inherit;font-size:13px;border:0;background:none;padding:6px 16px;border-radius:999px;cursor:pointer;color:#6b6290}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.btn{font:inherit;font-family:var(--disp);font-weight:400;font-size:20px;letter-spacing:.04em;color:var(--ink);background:var(--y);border:4px solid var(--ink);border-radius:999px;padding:10px 34px;box-shadow:0 6px 0 var(--ink);cursor:pointer;text-decoration:none;display:inline-block;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn.sm{font-size:15px;padding:7px 20px;background:#fff}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:14px}
.how div{background:#f7f5ff;border-radius:12px;padding:7px 4px;font-size:10.5px;line-height:1.4;color:#5e5585;font-weight:500}
.how b{display:block;font-size:12px;color:var(--ink);font-weight:800}
.how i{font-style:normal;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;font-size:10px;margin-bottom:2px}

/* roulette */
.rl h2{font-family:var(--disp);font-weight:400;font-size:clamp(24px,6vw,34px);margin:0 0 12px}
.rl h2 small{display:block;font-family:var(--body);font-size:12px;color:#8a83ad;letter-spacing:.1em;margin-bottom:2px}
.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rp{border-radius:16px;padding:10px 4px;background:#f0ecff;color:#8a83ad;border:3px solid transparent;transition:transform .08s}
.rp .i{font-size:22px;line-height:1.1;display:block}
.rp b{font-size:12.5px}
.rp.on{background:var(--rc);color:#fff;border-color:var(--ink);transform:scale(1.07);box-shadow:0 4px 0 var(--ink)}
.rres{margin-top:14px;min-height:46px;font-size:13px;color:#5e5585;font-weight:500;line-height:1.5}
.rres b{display:block;font-size:20px;color:var(--ink);font-weight:800}

/* score card */
.sc-wrap{overflow-x:auto;margin:0 -6px;padding:0 6px}
table.sc{border-collapse:separate;border-spacing:0;font-size:11px;margin:0 auto}
table.sc th,table.sc td{border:1.5px solid #ddd5fb;padding:0;text-align:center;min-width:30px}
table.sc th{background:#f4f1ff;color:#8a83ad;font-size:10px;padding:2px}
table.sc td.nm{text-align:left;padding:2px 6px;white-space:nowrap;min-width:70px}
table.sc td.nm span{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
table.sc .m{display:block;font-size:10px;letter-spacing:.08em;color:#6b6290;border-bottom:1px dashed #e4defc;padding:1px 2px;min-height:15px}
table.sc .c{display:block;font-size:12px;padding:1px 2px;min-height:17px}
table.sc td.tot{font-family:var(--disp);font-weight:400;font-size:15px;padding:0 6px}
table.sc tr.cur td{background:#fffbe6}

/* final */
.aw{display:flex;align-items:center;gap:10px;background:#f7f5ff;border-radius:16px;padding:8px 12px;margin-top:8px;text-align:left;animation:slide .45s cubic-bezier(.3,1.5,.5,1) both}
.aw .st{font-size:26px;color:var(--y);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.aw b{display:block;font-size:15px}
.aw small{font-size:11.5px;color:#8a83ad;font-weight:500}
.aw .who{margin-left:auto;display:flex;gap:2px}
.aw .who svg{width:32px;height:35px}
@keyframes slide{from{opacity:0;transform:translateY(16px) scale(.9)}}
.rank{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:end;margin-top:12px}
.rk{display:flex;flex-direction:column;align-items:center;animation:slide .5s cubic-bezier(.3,1.5,.5,1) both}
.rk svg{width:48px;height:53px}
.rk .ped{width:100%;border:3px solid var(--ink);border-bottom:0;border-radius:12px 12px 0 0;display:flex;flex-direction:column;align-items:center;padding:4px 0;color:var(--ink)}
.rk .ped b{font-family:var(--disp);font-weight:400;font-size:20px}
.rk .ped small{font-size:11px}
.rk .nm{font-size:12px;margin:2px 0}
.rk.p1 svg{animation:yay .6s cubic-bezier(.3,1.6,.5,1) infinite alternate}
.big{font-family:var(--disp);font-weight:400;font-size:clamp(26px,7vw,40px);margin:0 0 4px}
@media (max-width:420px){.chip .you{display:none}.how{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:16px 12px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="top">
  <div class="row">
    <a class="back" href="/">← アプリ一覧</a>
    <span class="sp"></span>
    <button class="tbtn" id="cardBtn" type="button">スコア表</button>
    <button class="tbtn" id="muteBtn" type="button" aria-pressed="false">音 ON</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="sub"><div id="badge" hidden></div><canvas id="mini" width="128" height="116" hidden></canvas></div>
</div>

<div id="hero" hidden><div class="av" id="heroAv"></div><div class="say" id="say"></div></div>

<div id="panel" hidden>
  <div class="steps" id="steps"><span class="step">位置</span><span class="step">方向</span><span class="step">パワー</span><span class="step">カーブ</span></div>
  <p class="msg" id="msg"></p>
  <div class="mwrap" id="mwrap"><div class="meter" id="meter"><div class="needle" id="needle"></div></div><div class="mlab" id="mlab"></div></div>
</div>

<div id="banner"></div>

<!-- title -->
<div class="ov" id="titleOv">
  <div class="card">
    <h1 class="logo" id="logo"></h1>
    <p class="lead">4人でワイワイ、ボウリング対決! 毎フレームのルーレットでレーンが変わる。<br>タイミング勝負だから、ストライクはそう簡単には出ないよ。</p>
    <p class="lbl">キャラをえらぶ(ほかの3人はCPU)</p>
    <div class="pick" id="pick"></div>
    <p class="lbl">フレーム数</p>
    <div class="seg" id="frames"><button type="button" data-n="5" aria-pressed="true">5フレーム</button><button type="button" data-n="10" aria-pressed="false">10フレーム</button></div>
    <div class="how">
      <div><i>1</i><b>位置</b>ドラッグ / ←→ で立ち位置。タップで決定</div>
      <div><i>2</i><b>方向</b>ゆれる矢印をタップで止める</div>
      <div><i>3</i><b>パワー</b>緑の「ナイス」でとめる。赤は力みすぎ</div>
      <div><i>4</i><b>カーブ</b>オイルが切れた先で曲がる</div>
    </div>
    <div class="btns"><button class="btn" id="startBtn" type="button">あそぶ!</button></div>
  </div>
</div>

<!-- roulette -->
<div class="ov" id="rlOv" hidden>
  <div class="card rl">
    <h2><small id="rlFrame">FRAME 1</small>レーンルーレット!</h2>
    <div class="rgrid" id="rgrid"></div>
    <div class="rres" id="rres"></div>
  </div>
</div>

<!-- score card -->
<div class="ov" id="cardOv" hidden>
  <div class="card">
    <p class="big">スコア表</p>
    <div class="sc-wrap"><table class="sc" id="scTable"></table></div>
    <div class="btns"><button class="btn sm" id="cardClose" type="button">とじる</button></div>
  </div>
</div>

<!-- final -->
<div class="ov" id="finalOv" hidden>
  <div class="card" id="finalCard"></div>
</div>

<script>
'use strict';
// ============================================================ SIM-START
// 物理: レーンを真上から見た2D。単位はメートルと秒。x=左右(右が+)、y=ファウルラインからの距離。
const LANE={halfW:0.533,headY:18.29,deckY:17.75,pitY:19.3,oilEnd:9.5,wallX:0.74};
const PHYS={ballM:7,pinM:1.5,H:1.0,ballFric:0.1,pinFric:3.5,ePB:0.45,ePP:0.6,eWall:0.35,fallV:0.3};
const RACK=(()=>{const s=0.3048,r=0.2638,h=LANE.headY;return[[0,h],[-s/2,h+r],[s/2,h+r],[-s,h+2*r],[0,h+2*r],[s,h+2*r],[-1.5*s,h+3*r],[-s/2,h+3*r],[s/2,h+3*r],[1.5*s,h+3*r]];})();
const AIM_MAX=2.5; // 度
function baseCond(){return{id:'normal',wind:0,hookMul:1,pinR:0.061,ballR:0.109,gold:-1};}
function newRack(cond){return RACK.map(([x,y],i)=>({id:i+1,x,y,vx:0,vy:0,st:0,tilt:0,tdir:1,gold:cond.gold===i}));}
function makeBall(x0,aimDeg,power,spin,cond){const v=5.5+3.5*power,a=aimDeg*Math.PI/180;return{x:x0,y:0,vx:v*Math.sin(a),vy:v*Math.cos(a),spin,r:cond.ballR,gutter:false,gone:false,roll:0};}
function makeSim(pins,ball,cond){return{pins:pins.map(p=>({...p})),ball,cond,t:0,tGone:0,hits:0,goldHit:false,done:false,gutterEarly:false};}
function stepBall(S,dt,noGutter){
  const b=S.ball,c=S.cond;
  if(!b.gutter){const k=b.y<LANE.oilEnd?0.12:1;b.vx+=(b.spin*PHYS.H*c.hookMul*k+c.wind)*dt;}
  const sp=Math.hypot(b.vx,b.vy)||1,ns=Math.max(1,sp-PHYS.ballFric*dt);b.vx*=ns/sp;b.vy*=ns/sp;
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.roll+=ns*dt/b.r;
  if(noGutter) return;
  if(!b.gutter){
    if(b.y<LANE.deckY){if(Math.abs(b.x)>LANE.halfW){b.gutter=true;S.gutterEarly=true;b.vx=0;}}
    else if(Math.abs(b.x)>LANE.wallX-b.r){b.x=Math.sign(b.x)*(LANE.wallX-b.r);b.vx=-b.vx*0.3;}
  }else{const gx=Math.sign(b.x)*(LANE.halfW+0.06);b.x+=(gx-b.x)*Math.min(1,dt*10);b.vx=0;}
  if(b.y>LANE.pitY+0.2){b.gone=true;S.tGone=S.t;}
}
function knock(S,p){
  const sp=Math.hypot(p.vx,p.vy);
  if(sp<PHYS.fallV){p.vx=0;p.vy=0;return;}
  p.st=1;const a=(Math.random()-.5)*0.3,cs=Math.cos(a),sn=Math.sin(a);
  const vx=p.vx*cs-p.vy*sn,vy=p.vx*sn+p.vy*cs;p.vx=vx;p.vy=vy;
  p.tdir=vx>=0?1:-1;if(p.gold)S.goldHit=true;
}
function hit(S,A,B,ra,rb,ma,e){
  const dx=B.x-A.x,dy=B.y-A.y,R=ra+rb,d2=dx*dx+dy*dy;if(d2>=R*R)return;
  const d=Math.sqrt(d2)||1e-4,nx=dx/d,ny=dy/d,ia=1/ma,ib=1/PHYS.pinM,it=ia+ib,pen=R-d;
  const vn=(B.vx-A.vx)*nx+(B.vy-A.vy)*ny;
  if(vn<0){
    const j=-(1+e)*vn/it;

function ballXAt(x0,aim,power,spin,cond,ty){
  const S={ball:makeBall(x0,aim,power,spin,cond),cond,t:0};const b=S.ball;

}
function pathOK(x0,aim,power,spin,cond,ty){
  const S={ball:makeBall(x0,aim,power,spin,cond),cond,t:0};const b=S.ball;

  const e0=ballXAt(x0,0,power,spin,cond,ty),e1=ballXAt(x0,1,power,spin,cond,ty);

function drawAim(x,aim){

  const t=7.8,h=P(x+sx*t,cy*t,0.01),l=P(x+sx*7.3-cy*0.12,cy*7.3+sx*0.12,0.01),r=P(x+sx*7.3+cy*0.12,cy*7.3-sx*0.12,0.01);
  if(h&&l&&r){ctx.beginPath();ctx.moveTo(h.x,h.y);ctx.lineTo(l.x,l.y);ctx.lineTo(r.x,r.y);ctx.closePath();ctx.fillStyle='#ffd23f';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#1d1640';ctx.stroke();}

const confetti=[];

function drawConfetti(dt){

// ---------- HUD ----------
const chipsEl=$('#chips');
function frameMarks(fr,last){
  const out=[];if(!fr)return out;
  if(!last){if(fr[0]===10)return['X'];if(fr.length>0)out.push(fr[0]?String(fr[0]):'-');if(fr.length>1)out.push(fr[0]+fr[1]===10?'/':(fr[1]?String(fr[1]):'-'));return out;}
  let fresh=true,prev=0;
  for(const r of fr){if(fresh){if(r===10){out.push('X');fresh=true;}else{out.push(r?String(r):'-');fresh=false;prev=r;}}
    else{out.push(prev+r===10?'/':(r?String(r):'-'));fresh=true;}}
  return out;
}
function frameDone(fr,last){if(!last)return fr[0]===10||fr.length===2;if(fr.length<2)return false;if(fr.length===2)return fr[0]+fr[1]<10;return true;}
function cumScores(frames,N){
  const rolls=[];for(let f=0;f<N;f++)if(frames[f])rolls.push(...frames[f]);
  const cum=[];let total=0,i=0;
  for(let f=0;f<N;f++){const fr=frames[f];if(!fr||!fr.length)break;
    if(f===N-1){if(!frameDone(fr,true))break;total+=fr.reduce((a,b)=>a+b,0);cum.push(total);break;}
    if(rolls[i]===10){if(rolls.length<i+3)break;total+=10+rolls[i+1]+rolls[i+2];i+=1;}
    else{if(rolls.length<i+2)break;if(rolls[i]+rolls[i+1]===10){if(rolls.length<i+3)break;total+=10+rolls[i+2];}else total+=rolls[i]+rolls[i+1];i+=2;}
    cum.push(total);}
  return cum;
}
const scoreOf=p=>{const c=cumScores(p.frames,G.N);return(c.length?c[c.length-1]:0)+p.bonus;};

// ---------- flow ----------
function startGame(){
  G.players=CH.map((ch,i)=>({ch,cpu:i!==chosen,frames:[],bonus:0,strikes:0,spares:0,gutters:0,golds:0,streak:0}));
  G.round=-1;$('#titleOv').hidden=true;['#panel','#hero','#badge','#mini'].forEach(s=>$(s).hidden=false);
  nextRound();
}
function nextRound(){
  G.round++;
  if(G.round>=G.N){finish();return;}
  G.cur=0;G.phase='roulette';
  const fin=Math.random()*EVENTS.length|0;
  G.ev=EVENTS[fin];G.cond=makeCond(G.ev);
  G.pins=newRack(G.cond);G.view=G.pins;
  $('#rlFrame').textContent=`FRAME ${G.round+1} / ${G.N}`+(G.round===G.N-1?' ラスト!':'');
  $('#rgrid').innerHTML=EVENTS.map(e=>`<div class="rp" style="--rc:${e.color}"><span class="i">${e.icon}</span><b>${e.name}</b></div>`).join('');
  $('#rres').innerHTML='';$('#rlOv').hidden=false;
  const start=Math.random()*6|0,steps=14+((fin-start)%6+6)%6;
  G.rl={i:0,steps,start,t:0,delay:0.05,done:false,hold:0};
  renderChips();renderBadge();setMsg('ルーレット!');setMeter(null);setSteps(-1);
}
function rouletteUpdate(dt){
  const r=G.rl;if(r.done){r.hold-=dt;if(r.hold<=0)closeRoulette();return;}
  r.t+=dt;
  while(r.t>=r.delay&&r.i<r.steps){r.t-=r.delay;r.i++;r.delay=0.045+0.016*r.i;SFX.tick();showRl((r.start+r.i)%6);}
  if(r.i>=r.steps&&r.t>0.25)endRoulette();
}
function showRl(k){document.querySelectorAll('.rp').forEach((e,i)=>e.classList.toggle('on',i===k));}
function endRoulette(){
  const r=G.rl;if(r.done)return;r.done=true;r.hold=2.2;showRl(EVENTS.indexOf(G.ev));SFX.award();
  let d=G.ev.desc;if(G.cond.wind)d=`風は${G.cond.wind>0?'右 →':'← 左'}向き。ボールが流されるよ`;
  if(G.cond.gold>=0)d=`${G.cond.gold+1}番ピンが金色! たおすと+5ボーナス`;
  $('#rres').innerHTML=`<b>${G.ev.name}</b>${d}<br><small>タップで次へ</small>`;
  G.pins=newRack(G.cond);G.view=G.pins;renderBadge();drawMini();
}
function closeRoulette(){$('#rlOv').hidden=true;startTurn();}
function startTurn(){
  const p=cur();p.frames[G.round]=[];G.pins=newRack(G.cond);G.view=G.pins;
  $('#heroAv').innerHTML=avatar(p.ch);
  renderChips();drawMini();
  G.phase='intro';G.pt=0;G.bx=0;G.sim=null;
  banner(`${p.ch.name}の番!`,p.cpu?'CPU':'あなたの番だよ',p.ch.color);SFX.turn();
  setSteps(-1);setMsg(p.cpu?`${p.ch.name}がじゅんび中…`:'もうすぐスタート');setMeter(null);
  say(p.cpu?['いくよ〜!','見ててね!','ストライクねらう!','まかせて!'][Math.random()*4|0]:'がんばって!');
}
function beginBall(){
  const p=cur();G.view=G.pins;G.sim=null;G.pt=0;G.ff=false;drawMini();
  if(p.cpu){
    G.phase='cpu';setSteps(-1);setMsg(`${p.ch.name}がねらっている… <small>(タップで早送り)</small>`);setMeter(null);
    G.plan=noisyShot(cpuPlan(G.pins,G.cond,p.ch),p.ch.skill);G.startX=G.bx;
  }else{
    G.phase='pos';G.locked={};setSteps(0);setMeter('aim');
    setMsg('ドラッグ / ←→ で立ち位置。<b>タップで決定</b>');
  }
}
function tap(){
  ensureAudio();
  switch(G.phase){
    case'intro':G.pt=99;break;
    case'pos':SFX.lock();G.phase='aim';G.pt=0;G.off=Math.random();setSteps(1);setMeter('aim');setMsg('ゆれる矢印をタップで止めて<b>方向</b>を決める');break;
    case'aim':SFX.lock();G.phase='power';G.pt=0;setSteps(2);setMeter('pow');setMsg('<b>パワー</b>! 緑のナイスゾーンでタップ');break;
    case'power':{SFX.lock();const pw=G.power;let note='';
      if(pw>0.95){G.aim=clamp(G.aim+(Math.random()-.5)*0.8,-AIM_MAX,AIM_MAX);note='力みすぎ! 方向がブレた';say('うわっ、力みすぎ!','boo');}
      else if(pw>=0.78&&pw<=0.9){note='ナイス!';say('ナイスパワー!','yay');}
      else if(pw<0.5){note='ちょっとよわい…';}
      G.phase='spin';G.pt=0;setSteps(3);setMeter('spin');setMsg(`<b>カーブ</b>をタップで決める${note?` <small>(${note})</small>`:''}`);break;}
    case'spin':SFX.lock();throwBall({x:G.bx,aim:G.aim,power:G.power,spin:G.spin});break;
    case'cpu':case'roll':G.ff=true;break;
    case'result':G.wait=0;break;
    case'roulette':if(!G.rl.done){G.rl.i=G.rl.steps;endRoulette();}else closeRoulette();break;
  }
}
function throwBall(s){
  G.shot=s;G.sim=makeSim(G.pins,makeBall(s.x,s.aim,s.power,s.spin,G.cond),G.cond);G.view=G.sim.pins;
  G.phase='roll';G.pt=0;setSteps(4);setMeter(null);setMsg(cur().cpu?'<small>タップで早送り</small>':'いけーっ!');
  ensureAudio();rollStart();
}
function rollEnd(){
  rollStop();
  const S=G.sim,p=cur(),last=G.round===G.N-1,before=G.pins.length;
  const after=S.pins.filter(q=>q.st===0),down=before-after.length,fr=p.frames[G.round];fr.push(down);
  let t,sub='',col='#ffd23f',kind='',long=false;
  if(before===10&&down===10){p.strikes++;p.streak++;t=p.streak===1?'ストライク!':p.streak===2?'ダブル!':p.streak===3?'ターキー!':`${p.streak}れんぞく!`;kind='yay';SFX.strike();burst(p.streak>1?220:150);long=true;}
  else if(before<10&&after.length===0){p.spares++;p.streak=0;t='スペア!';col='#7fd6ff';kind='yay';SFX.spare();burst(80);}
  else{
    if(fr.length===1||(last&&before===10))p.streak=0;
    if(S.gutterEarly){p.gutters++;t='ガター…';col='#c9c3e6';kind='boo';SFX.gutter();}
    else if(down===0){t='ミス…';col='#c9c3e6';kind='boo';SFX.meh();}
    else{t=`${down}ピン!`;col='#fff';SFX.meh();
      if(before===10&&isSplit(after)){t='スプリット!';col='#ff8a3d';sub=`${down}ピン。むずかしい形…`;kind='boo';}}
    if(down===0&&before<10)p.streak=0;
  }
  if(before<10&&after.length>0)p.streak=0;
  if(S.goldHit){p.bonus+=5;p.golds++;sub=(sub?sub+' / ':'')+'ゴールドピン +5!';setTimeout(SFX.gold,350);}
  banner(t,sub,col,long);
  say(kind==='yay'?['やったー!','きもちいい〜!','見た!?'][Math.random()*3|0]:kind==='boo'?['あちゃ〜','くやしい!','つぎこそ…'][Math.random()*3|0]:'まあまあ!',kind);
  renderChips();renderCard();
  const done=frameDone(fr,last);
  if(!done)G.pins=after.length?after.map(q=>({...q,vx:0,vy:0})):newRack(G.cond);
  G.phase='result';G.wait=long?2.2:1.6;G.next=done?nextTurn:beginBall;
}
function isSplit(st){
  if(st.some(p=>p.id===1)||st.length<2)return false;
  const seen=new Set([st[0].id]),q=[st[0]];
  while(q.length){const a=q.pop();for(const b of st)if(!seen.has(b.id)&&Math.hypot(RACK[a.id-1][0]-RACK[b.id-1][0],RACK[a.id-1][1]-RACK[b.id-1][1])<0.32){seen.add(b.id);q.push(b);}}
  return seen.size<st.length;
}
function nextTurn(){G.cur++;if(G.cur>=G.players.length)nextRound();else startTurn();}

// ---------- final ----------
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function finish(){
  G.phase='final';rollStop();['#panel','#hero'].forEach(s=>$(s).hidden=true);renderChips();
  const fc=$('#finalCard');$('#finalOv').hidden=false;
  fc.innerHTML='<p class="big">ボーナスタイム!</p><p class="lead" style="margin:0">さいごに3つの賞を発表! 1つにつき +10点</p><div id="aws"></div>';
  SFX.fanfare();await sleep(1400);
  const AW=[{k:'strikes',n:'ストライク賞',d:'ストライクがいちばん多い'},{k:'spares',n:'スペア賞',d:'スペアがいちばん多い'},{k:'gutters',n:'ガター賞',d:'ガターがいちばん多い(ドンマイ!)'}];
  for(const a of AW){
    const mx=Math.max(...G.players.map(p=>p[a.k]));const win=mx>0?G.players.filter(p=>p[a.k]===mx):[];
    win.forEach(p=>p.bonus+=10);
    const el=document.createElement('div');el.className='aw';
    el.innerHTML=`<span class="st">★</span><div><b>${a.n}</b><small>${a.d}${mx>0?`(${mx}回)`:''}</small></div><div class="who">${win.length?win.map(p=>avatar(p.ch)).join(''):'<small>該当なし</small>'}</div>`;
    $('#aws').appendChild(el);SFX.award();renderChips();await sleep(1500);
  }
  await sleep(500);
  const ranked=[...G.players].sort((a,b)=>scoreOf(b)-scoreOf(a));
  const rank=p=>1+G.players.filter(q=>scoreOf(q)>scoreOf(p)).length;
  const me=G.players[chosen],myRank=rank(me);
  const order=[ranked[1],ranked[0],ranked[2],ranked[3]];
  const hgt={1:96,2:72,3:54,4:40},pcol={1:'#ffd23f',2:'#dfe3f0',3:'#ffb37a',4:'#e9e4fb'};
  fc.innerHTML=`<p class="big">${myRank===1?'あなたの優勝!':`あなたは ${myRank}位!`}</p><p class="lead" style="margin:0">${myRank===1?'おめでとう! パーティーの主役だ!':myRank<=2?'おしい! あと少しで1位!':'つぎはナイスゾーンをねらってみよう'}</p>
  <div class="rank">${order.map((p,i)=>{const r=rank(p);return`<div class="rk p${r}" style="animation-delay:${[.5,.9,.3,.1][i]}s">${avatar(p.ch)}<span class="nm">${p.ch.name}${p.cpu?'':'(あなた)'}</span><div class="ped" style="height:${hgt[r]}px;background:${pcol[r]}"><b>${r}位</b><small>${scoreOf(p)}点</small></div></div>`;}).join('')}</div>
  <div class="sc-wrap" style="margin-top:14px"><table class="sc" id="scFinal"></table></div>
  <div class="btns"><button class="btn" id="againBtn" type="button">もう一回</button><a class="btn sm" href="/">アプリ一覧</a></div>`;
  renderCard();$('#scFinal').innerHTML=$('#scTable').innerHTML;
  if(myRank===1){burst(260);SFX.fanfare();}else SFX.spare();
  $('#againBtn').onclick=()=>{$('#finalOv').hidden=true;startGame();};
}

// ---------- update loop ----------
let last=performance.now();
function update(dt){
  T+=dt;G.pt+=dt;
  if(sayT>0){sayT-=dt;if(sayT<=0)$('#say').classList.remove('on');}
  let camTy=CAM0,camTh=1.1;
  switch(G.phase){
    case'roulette':rouletteUpdate(dt);break;
    case'intro':if(G.pt>1.3)beginBall();break;
    case'pos':setNeedle(0.5+G.bx/0.84);break;
    case'aim':G.aim=AIM_MAX*Math.sin(2*Math.PI*(G.pt/2.2+G.off));setNeedle(0.5+G.aim/AIM_MAX/2);break;
    case'power':G.power=tri(G.pt/2.3);setNeedle(G.power);break;
    case'spin':G.spin=2*tri(G.pt/1.5+0.25)-1;setNeedle(0.5+G.spin/2);break;
    case'cpu':{const sp=G.ff?3:1;G.pt+=dt*(sp-1);const k=clamp(G.pt/0.6,0,1);G.bx=G.startX+(G.plan.x-G.startX)*(1-Math.pow(1-k,3));if(G.pt>1.5)throwBall(G.plan);break;}
    case'roll':{
      const S=G.sim,sp=(G.ff?4:cur().cpu?1.4:1);let n=Math.round(dt*sp*240);const h0=S.hits;
      for(let i=0;i<n&&!S.done;i++)stepSim(S,1/240);
      const dh=S.hits-h0;if(dh>0.3)SFX.crash(dh);
      rollSet(S.ball.gone?0:S.ball.gutter?0.25:0.45);
      if(S.done)rollEnd();
      camTy=clamp(S.ball.y-3.3,CAM0,LANE.headY-4);if(S.ball.gone)camTy=LANE.headY-4;camTh=1.1-0.2*clamp((camTy-CAM0)/16,0,1);
      break;}
    case'result':{G.wait-=dt;const S=G.sim;for(let i=0;i<Math.round(dt*240);i++)if(!S.done)stepSim(S,1/240);
      camTy=LANE.headY-4;camTh=0.9;if(G.wait<=0){const f=G.next;G.next=null;G.view=G.pins;f&&f();}break;}
  }
  const k=1-Math.exp(-dt*(G.phase==='roll'?5:3));cam.y+=(camTy-cam.y)*k;cam.h+=(camTh-cam.h)*k;
}
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);draw(dt);if(G.phase!=='title'&&G.phase!=='final')drawMini();requestAnimationFrame(loop);}

// ---------- input ----------
let drag=null;
cv.addEventListener('pointerdown',e=>{
  ensureAudio();
  if(G.phase==='pos'){drag={last:e.clientX,moved:0};try{cv.setPointerCapture(e.pointerId);}catch(_){};}
  else tap();
});
cv.addEventListener('pointermove',e=>{if(!drag||G.phase!=='pos')return;const dx=e.clientX-drag.last;drag.last=e.clientX;drag.moved+=Math.abs(dx);G.bx=clamp(G.bx+dx/(F/(0-cam.y)),-0.42,0.42);});
cv.addEventListener('pointerup',()=>{if(drag&&drag.moved<8&&G.phase==='pos')tap();drag=null;});
cv.addEventListener('pointercancel',()=>{drag=null;});
$('#rlOv').addEventListener('pointerdown',()=>{if(G.phase==='roulette')tap();});
addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('button,a'))return;
  if(G.phase==='title'||G.phase==='final'||!$('#cardOv').hidden)return;
  if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(!e.repeat)tap();}
  else if(G.phase==='pos'&&(e.code==='ArrowLeft'||e.code==='ArrowRight')){e.preventDefault();G.bx=clamp(G.bx+(e.code==='ArrowLeft'?-0.02:0.02),-0.42,0.42);}
});
$('#cardBtn').onclick=()=>{renderCard();$('#cardOv').hidden=false;};
$('#cardClose').onclick=()=>{$('#cardOv').hidden=true;};
$('#muteBtn').onclick=e=>{muted=!muted;e.currentTarget.textContent=muted?'音 OFF':'音 ON';e.currentTarget.setAttribute('aria-pressed',muted);if(master)master.gain.value=muted?0:0.5;};

// ---------- title ----------
$('#logo').innerHTML=[...'ストライク★パーティー'].map((c,i)=>`<span style="color:${['#ffd23f','#ff4f6d','#7fd6ff','#2ec27e','#ff8a3d','#c7a6ff'][i%6]}">${c}</span>`).join('');
function renderPick(){
  $('#pick').innerHTML=CH.map((c,i)=>`<button type="button" class="pc" style="--c:${c.color};--cd:${c.dark}" aria-pressed="${i===chosen}" data-i="${i}">${avatar(c)}<b>${c.name}</b><small>${c.blurb}<br>CPUの強さ ${'★'.repeat(c.stars)}${'☆'.repeat(3-c.stars)}</small></button>`).join('');
}
renderPick();
$('#pick').addEventListener('click',e=>{const b=e.target.closest('.pc');if(!b)return;chosen=+b.dataset.i;renderPick();ensureAudio();SFX.tick();});
$('#frames').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;G.N=+b.dataset.n;document.querySelectorAll('#frames button').forEach(x=>x.setAttribute('aria-pressed',x===b));});
$('#startBtn').onclick=()=>{ensureAudio();SFX.turn();startGame();};
G.view=newRack(G.cond);
requestAnimationFrame(loop);
</script>
</body>
