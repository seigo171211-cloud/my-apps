<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ぬりぬりバトル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<link rel="stylesheet" href="arcade.css">
<style>
:root{--p1:#ffb52e;--p2:#8f7bff;--accent:#5dffb0;--glow:#8f7bff}
body{background:radial-gradient(1200px 600px at 50% -10%,#2a1f4a 0%,#07060d 62%)}
.items{display:flex;gap:2.2cqw;justify-content:center;font-size:1.25cqw;color:var(--muted);margin:.4cqw 0}
.items b{color:#fff}
</style>
</head>
<body>
<header class="bar">
  <a class="back" href="/">← アプリ一覧</a>
  <h1>ぬりぬりバトル</h1>
  <div class="tools">
    <button class="chip" id="muteBtn">🔊 音 ON (M)</button>
    <button class="chip" id="pauseBtn">⏸ 一時停止 (Esc)</button>
  </div>
</header>
<div class="wrap">
<div class="frame">
  <canvas id="cv" width="1280" height="720"></canvas>

  <div class="ov" id="ovTitle">
    <h2 class="title">NURI NURI BATTLE</h2>
    <p class="sub">走ったところが自分の色になる。時間切れのとき、広くぬっていた方の勝ち！<br>相手の色は上からぬり返せます。</p>
    <div class="ctrls">
      <div class="ctrl p1"><h3>PLAYER 1</h3>
        移動 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><br>
        スプラッシュ <kbd>F</kbd> / <kbd>Space</kbd>
        <div class="rdy" id="rdy0"></div></div>
      <div class="ctrl p2"><h3><span data-pname="1">PLAYER 2</span></h3>
        移動 <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd><br>
        スプラッシュ <kbd>Enter</kbd> / <kbd>/</kbd> / <kbd>0</kbd>
        <div class="rdy" id="rdy1"></div></div>
    </div>
    <div class="items"><span><b>●ボム</b> まわりを一気にぬる</span><span><b>▲スピード</b> 6秒間はやくなる</span><span><b>◆フリーズ</b> 相手が少し止まる</span></div>
    <div class="row">試合時間
      <div class="seg" id="segTime"><button data-v="45">45秒</button><button data-v="60" aria-pressed="true">60秒</button><button data-v="90">90秒</button></div>
    </div>
    <p class="hint">日本語入力はオフにしてね</p>
    <p class="touchnote">※ キーボードのあるPCで遊んでください</p>
    <button class="btn" id="startBtn">スタート</button>
  </div>

  <div class="ov" id="ovPause" hidden>
    <p class="big">PAUSE</p>
    <div class="row"><button class="btn" id="resumeBtn">つづける</button><button class="btn ghost" id="quitBtn">タイトルへ</button></div>
    <p class="hint">Esc でもどる</p>
  </div>

  <div class="ov" id="ovEnd" hidden>
    <p class="sub">TIME UP</p>
    <p class="big" id="endTitle">P1 WIN!</p>
    <p class="sub" id="endScore"></p>
    <div class="ctrls"><div class="rdy" id="erdy0"></div><div class="rdy" id="erdy1"></div></div>
    <div class="row"><button class="btn" id="againBtn">もう一度</button><button class="btn ghost" id="titleBtn">タイトルへ</button></div>
  </div>
</div>
</div>
<script src="touch.js"></script>
<script src="cpu.js"></script>
<script src="arcade.js"></script>
<script>
// Territory painting: each player colours the cells they run over; most cells at the buzzer wins.
const {tone,noise,show,hide,$}=Arcade;
const W=1280,H=720,CS=40,COLS=30,ROWS=15,OX=40,OY=96;   // board = 1200x600
const N=COLS*ROWS,BR=42,SPLASH=112,BOMB=180,PR=20;
const COL=['#ffb52e','#8f7bff'],DARK=['#7a4d00','#2f2478'];
const cv=$('cv'),ctx=cv.getContext('2d');

let state='title',prevState='title',matchTime=60,timeLeft=60,countT=0,time=0,shake=0,itemT=3,lastTick=0;
const grid=new Int8Array(N).fill(-1),pop=new Float32Array(N),cnt=[0,0];
const P=[0,1].map(i=>({i,x:0,y:0,vx:0,vy:0,cool:0,fast:0,frozen:0,face:i?Math.PI:0}));
let items=[],rings=[],parts=[];
const AI={t:0,tx:0,ty:0,ax:{x:0,y:0}};

function resetBoard(){
  grid.fill(-1);pop.fill(0);cnt[0]=cnt[1]=0;items=[];rings=[];parts=[];itemT=3;
  P[0].x=OX+CS*2.5;P[1].x=OX+CS*(COLS-2.5);
  for(const m of P){m.y=OY+CS*ROWS/2;m.vx=m.vy=0;m.cool=0;m.fast=0;m.frozen=0;m.face=m.i?Math.PI:0}
}
function startMatch(){resetBoard();timeLeft=matchTime;hide('ovTitle');hide('ovEnd');state='count';countT=2.4;lastTick=3;AI.t=0}

// Colour every cell whose centre lies within rad of (x,y). Returns how many cells changed.
function paint(p,x,y,rad){
  const c0=Math.max(0,Math.floor((x-rad-OX)/CS)),c1=Math.min(COLS-1,Math.floor((x+rad-OX)/CS));
  const r0=Math.max(0,Math.floor((y-rad-OY)/CS)),r1=Math.min(ROWS-1,Math.floor((y+rad-OY)/CS));
  let n=0;
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
    const cx=OX+c*CS+CS/2,cy=OY+r*CS+CS/2;
    if(Math.hypot(cx-x,cy-y)>rad)continue;
    const k=r*COLS+c,g=grid[k];
    if(g===p)continue;
    if(g>=0)cnt[g]--;
    grid[k]=p;cnt[p]++;pop[k]=1;n++;
  }
  return n;
}
function burst(x,y,c,n,sp){for(let k=0;k<n;k++){const a=Math.random()*7,s=sp*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.3+Math.random()*.5,c,r:2+Math.random()*4})}}
function splash(m){
  if(m.cool>0||m.frozen>0)return;
  m.cool=2.6;paint(m.i,m.x,m.y,SPLASH);
  rings.push({x:m.x,y:m.y,r:SPLASH,t:.35,c:COL[m.i]});burst(m.x,m.y,COL[m.i],26,520);
  tone(m.i?250:210,.18,'sawtooth',.09,2.4);noise(.18,.18,2400);shake=Math.max(shake,5);
}
function spawnItem(){
  for(let tries=0;tries<20;tries++){
    const x=OX+CS*(1.5+Math.random()*(COLS-3)),y=OY+CS*(1.5+Math.random()*(ROWS-3));
    if(P.some(m=>Math.hypot(m.x-x,m.y-y)<200)||items.some(it=>Math.hypot(it.x-x,it.y-y)<160))continue;
    items.push({x,y,type:['bomb','fast','ice'][Math.random()*3|0],age:0});tone(990,.07,'triangle',.06);return;
  }
}
function pickup(m,it){
  const o=P[1-m.i];
  if(it.type==='bomb'){paint(m.i,it.x,it.y,BOMB);rings.push({x:it.x,y:it.y,r:BOMB,t:.5,c:COL[m.i]});burst(it.x,it.y,COL[m.i],60,760);noise(.5,.32,1400);tone(110,.3,'square',.14,.5);shake=16}
  else if(it.type==='fast'){m.fast=6;[523,659,784].forEach((f,i)=>tone(f,.08,'square',.08,1,i*.06))}
  else{o.frozen=1.8;o.vx=o.vy=0;burst(o.x,o.y,'#bfefff',26,360);tone(1400,.3,'triangle',.1,.4)}
}

// ---------- CPU (drives player 2) ----------
function cpuThink(dt){
  const m=P[1],L=CpuMode.lv;AI.t-=dt;
  if(AI.t<=0){
    AI.t=L(.5,.26,.13);
    let bs=-1e9,bx=m.x,by=m.y;
    for(let k=0;k<L(14,34,70);k++){
      const c=Math.random()*COLS|0,r=Math.random()*ROWS|0,g=grid[r*COLS+c];
      if(g===1)continue;
      const x=OX+c*CS+CS/2,y=OY+r*CS+CS/2,d=Math.hypot(x-m.x,y-m.y);
      const s=(g===0?L(100,125,150):100)-d*L(.22,.4,.55)+Math.random()*L(60,25,8);
      if(s>bs){bs=s;bx=x;by=y}
    }
    if(CpuMode.level>0)for(const it of items){const s=L(0,190,250)-Math.hypot(it.x-m.x,it.y-m.y)*.45;if(s>bs){bs=s;bx=it.x;by=it.y}}
    AI.tx=bx;AI.ty=by;
  }
  const dx=AI.tx-m.x,dy=AI.ty-m.y,d=Math.hypot(dx,dy),sp=L(.74,.92,1);
  AI.ax=d<8?{x:0,y:0}:{x:dx/d*sp,y:dy/d*sp};
  if(m.cool<=0&&m.frozen<=0){
    let n=0;
    for(let k=0;k<N;k++){if(grid[k]===1)continue;const x=OX+(k%COLS)*CS+CS/2,y=OY+(k/COLS|0)*CS+CS/2;if(Math.hypot(x-m.x,y-m.y)<=SPLASH)n++}
    if(n>=L(22,16,12)&&Math.random()<L(.03,.2,.6))splash(m);
  }
}
function axisOf(m){
  if(m.i===1&&CpuMode.on)return AI.ax;
  const sk=typeof TouchPad!=='undefined'&&TouchPad.stick[m.i];
  if(sk&&sk.on)return{x:sk.x,y:sk.y};
  const a=Arcade.axis(m.i),l=Math.hypot(a.x,a.y)||1;return{x:a.x/l,y:a.y/l};
}

Arcade.on({
  press(p,a){
    if(state==='title'&&a==='act')ready.press(p);
    else if(state==='end'&&a==='act')ready2.press(p);
    else if(state==='play'&&a==='act')splash(P[p]);
  },
  pause:togglePause,
  blur(){if(state==='play'||state==='count')togglePause()}
});
const ready=Arcade.readyCheck(['rdy0','rdy1'],startMatch);
const ready2=Arcade.readyCheck(['erdy0','erdy1'],startMatch);

function update(dt){
  time+=dt;shake=Math.max(0,shake-dt*50);
  for(let k=0;k<N;k++)if(pop[k]>0)pop[k]=Math.max(0,pop[k]-dt*5);
  for(const q of parts){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.92;q.vy*=.92}
  parts=parts.filter(q=>q.life>0);
  for(const r of rings)r.t-=dt;rings=rings.filter(r=>r.t>0);
  if(state==='count'){
    countT-=dt;const n=Math.ceil(countT/.8);
    if(n<lastTick&&n>0){lastTick=n;tone(520,.1,'square',.1)}
    if(countT<=0){state='play';tone(1040,.25,'square',.12)}
    return;
  }
  if(state!=='play')return;
  timeLeft-=dt;
  if(timeLeft<=10&&Math.ceil(timeLeft)<lastTick){lastTick=Math.ceil(timeLeft);tone(timeLeft<=3?880:660,.07,'square',.08)}
  if(timeLeft>10)lastTick=11;
  if(timeLeft<=0){timeLeft=0;showEnd();return}
  if(CpuMode.on)cpuThink(dt);
  for(const m of P){
    m.cool=Math.max(0,m.cool-dt);m.fast=Math.max(0,m.fast-dt);m.frozen=Math.max(0,m.frozen-dt);
    const a=axisOf(m),sp=m.frozen>0?0:330*(m.fast>0?1.55:1),k=Math.min(1,dt*13);
    m.vx+=(a.x*sp-m.vx)*k;m.vy+=(a.y*sp-m.vy)*k;
    m.x=Math.max(OX+PR,Math.min(OX+COLS*CS-PR,m.x+m.vx*dt));
    m.y=Math.max(OY+PR,Math.min(OY+ROWS*CS-PR,m.y+m.vy*dt));
    if(Math.hypot(m.vx,m.vy)>30)m.face=Math.atan2(m.vy,m.vx);
    if(m.frozen<=0&&paint(m.i,m.x,m.y,BR)&&Math.random()<.25)parts.push({x:m.x,y:m.y,vx:(Math.random()-.5)*160,vy:(Math.random()-.5)*160,life:.3,c:COL[m.i],r:3});
  }
  // the two blobs bump off each other
  const dx=P[1].x-P[0].x,dy=P[1].y-P[0].y,d=Math.hypot(dx,dy);
  if(d<PR*2+4&&d>0){const nx=dx/d,ny=dy/d,o=(PR*2+4-d)/2;P[0].x-=nx*o;P[0].y-=ny*o;P[1].x+=nx*o;P[1].y+=ny*o;
    P[0].vx-=nx*260;P[0].vy-=ny*260;P[1].vx+=nx*260;P[1].vy+=ny*260;tone(180,.05,'square',.06)}
  itemT-=dt;if(itemT<=0){itemT=4.5+Math.random()*3;if(items.length<2)spawnItem()}
  for(const it of items){it.age+=dt;for(const m of P)if(!it.dead&&Math.hypot(m.x-it.x,m.y-it.y)<PR+22){it.dead=true;pickup(m,it)}}
  items=items.filter(it=>!it.dead);
}
function showEnd(){
  state='end';const a=cnt[0],b=cnt[1],t=$('endTitle');
  if(a===b){t.textContent='DRAW';t.style.color='#fff';t.style.textShadow='none'}
  else{const w=a>b?0:1;t.textContent=CpuMode.winText(w);t.style.color=COL[w];t.style.textShadow=`0 0 3cqw ${COL[w]}`}
  $('endScore').textContent=`${Math.round(a/N*100)}%（${a}マス） - ${Math.round(b/N*100)}%（${b}マス）`;
  ready2.reset();show('ovEnd');noise(.5,.25,1200);Arcade.fanfare();
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawItem(it){
  const b=Math.sin(time*4+it.x)*4,s=Math.min(1,it.age*4);
  ctx.save();ctx.translate(it.x,it.y+b);ctx.scale(s,s);
  ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=22;ctx.beginPath();ctx.arc(0,0,22,0,7);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle='#14121f';ctx.strokeStyle='#14121f';ctx.lineWidth=3;ctx.lineCap='round';
  if(it.type==='bomb'){ctx.beginPath();ctx.arc(-1,3,10,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(5,-6);ctx.lineTo(10,-13);ctx.stroke()}
  else if(it.type==='fast'){ctx.beginPath();ctx.moveTo(3,-14);ctx.lineTo(-9,3);ctx.lineTo(-1,3);ctx.lineTo(-4,14);ctx.lineTo(9,-3);ctx.lineTo(1,-3);ctx.closePath();ctx.fill()}
  else{ctx.beginPath();ctx.moveTo(0,-13);ctx.lineTo(11,0);ctx.lineTo(0,13);ctx.lineTo(-11,0);ctx.closePath();ctx.fill()}
  ctx.restore();
}
function drawPlayer(m){
  const c=COL[m.i],wob=Math.sin(time*14+m.i)*Math.min(1,Math.hypot(m.vx,m.vy)/300)*2;
  ctx.save();ctx.translate(m.x,m.y);
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(3,8,PR,PR*.8,0,0,7);ctx.fill();
  if(m.fast>0){ctx.strokeStyle='#fff';ctx.globalAlpha=.5+.3*Math.sin(time*20);ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,PR+7,0,7);ctx.stroke();ctx.globalAlpha=1}
  ctx.fillStyle=m.frozen>0?'#bfefff':c;ctx.strokeStyle='#fff';ctx.lineWidth=4;
  ctx.beginPath();ctx.ellipse(0,0,PR+wob,PR-wob,0,0,7);ctx.fill();ctx.stroke();
  const ex=Math.cos(m.face)*6,ey=Math.sin(m.face)*6,px=-Math.sin(m.face)*7,py=Math.cos(m.face)*7;
  for(const s of[-1,1]){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex+px*s,ey+py*s,5.5,0,7);ctx.fill();ctx.fillStyle='#14121f';ctx.beginPath();ctx.arc(ex*1.35+px*s,ey*1.35+py*s,2.6,0,7);ctx.fill()}
  if(m.cool<=0&&state==='play'){ctx.strokeStyle=c;ctx.globalAlpha=.35+.25*Math.sin(time*6);ctx.lineWidth=2;ctx.setLineDash([6,8]);ctx.beginPath();ctx.arc(0,0,SPLASH,0,7);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1}
  else if(m.cool>0){ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,PR+12,-Math.PI/2,-Math.PI/2+Math.PI*2*(1-m.cool/2.6));ctx.stroke()}
  ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  ctx.fillStyle='#0d0b18';rr(OX-8,OY-8,COLS*CS+16,ROWS*CS+16,14);ctx.fill();
  for(let k=0;k<N;k++){
    const g=grid[k],x=OX+(k%COLS)*CS,y=OY+(k/COLS|0)*CS,e=pop[k]*5;
    if(g<0){ctx.fillStyle='#1a1729';rr(x+2,y+2,CS-4,CS-4,7);ctx.fill();continue}
    ctx.fillStyle=COL[g];rr(x+1-e,y+1-e,CS-2+e*2,CS-2+e*2,8);ctx.fill();
    ctx.fillStyle=DARK[g]+'55';rr(x+1,y+CS-9,CS-2,8,5);ctx.fill();
  }
  for(const r of rings){ctx.strokeStyle=r.c;ctx.globalAlpha=r.t*2;ctx.lineWidth=8;ctx.beginPath();ctx.arc(r.x,r.y,r.r*(1-r.t*.4),0,7);ctx.stroke();ctx.globalAlpha=1}
  items.forEach(drawItem);P.forEach(drawPlayer);
  for(const q of parts){ctx.globalAlpha=Math.min(1,q.life*3);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fill()}
  ctx.globalAlpha=1;ctx.restore();
  // HUD: share bar + clock
  const bx=190,bw=900,by=34,bh=30,tot=Math.max(1,cnt[0]+cnt[1]),a=cnt[0]/tot;
  ctx.fillStyle='#1a1729';rr(bx,by,bw,bh,15);ctx.fill();
  if(cnt[0]+cnt[1]>0){ctx.save();rr(bx,by,bw,bh,15);ctx.clip();ctx.fillStyle=COL[0];ctx.fillRect(bx,by,bw*a,bh);ctx.fillStyle=COL[1];ctx.fillRect(bx+bw*a,by,bw*(1-a),bh);ctx.restore()}
  ctx.textBaseline='middle';ctx.font='400 34px "Dela Gothic One"';
  ctx.textAlign='right';ctx.fillStyle=COL[0];ctx.fillText(Math.round(cnt[0]/N*100)+'%',bx-16,by+bh/2+2);
  ctx.textAlign='left';ctx.fillStyle=COL[1];ctx.fillText(Math.round(cnt[1]/N*100)+'%',bx+bw+16,by+bh/2+2);
  const tl=Math.ceil(timeLeft);
  ctx.textAlign='center';ctx.fillStyle='#07060d';rr(W/2-52,by-10,104,bh+20,14);ctx.fill();
  ctx.fillStyle=tl<=10&&state==='play'?'#ff5d6c':'#fff';ctx.font='400 36px "Dela Gothic One"';ctx.fillText(tl,W/2,by+bh/2+3);
  if(state==='count'){
    const n=Math.ceil(countT/.8);ctx.font='400 150px "Dela Gothic One"';ctx.fillStyle='#fff';ctx.shadowColor='#000';ctx.shadowBlur=30;
    ctx.fillText(n,W/2,OY+ROWS*CS/2);ctx.shadowBlur=0;
  }
}
function togglePause(){
  if(state==='paused'){state=prevState;hide('ovPause');return}
  if(state==='play'||state==='count'){prevState=state;state='paused';show('ovPause')}
}
function toTitle(){state='title';ready.reset();hide('ovPause');hide('ovEnd');show('ovTitle');resetBoard();timeLeft=matchTime}
$('pauseBtn').onclick=e=>{togglePause();e.target.blur()};
$('resumeBtn').onclick=togglePause;$('quitBtn').onclick=toTitle;$('titleBtn').onclick=toTitle;
$('againBtn').onclick=()=>{Arcade.unlock();startMatch()};$('startBtn').onclick=()=>{Arcade.unlock();startMatch()};
document.querySelectorAll('#segTime button').forEach(b=>b.onclick=()=>{matchTime=timeLeft=+b.dataset.v;document.querySelectorAll('#segTime button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
resetBoard();
CpuMode.mount('nuri',$('segTime').parentNode,()=>{ready.reset();ready2.reset()});
Arcade.touch([{pad:'stick',act:'スプラッシュ'},{pad:'stick',act:'スプラッシュ'}],{note:'スマホは横向きで。スティックで移動、ボタンでスプラッシュ'});
Arcade.loop(dt=>{if(state!=='paused')update(dt);draw()});
</script>
</body>
</html>
