<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<style>
/* Lunar landing simulator. Terrain, lander model, physics and post-processing are all generated in this file; three.js (vendored) is the renderer. */
:root{--ink:#f3f1ea;--muted:#9a978e;--am:#ffb65a;--red:#ff5a4d;--ok:#8fe3a2;--panel:rgba(10,10,12,.74);--line:rgba(255,255,255,.16);
  --num:"Rajdhani","Zen Kaku Gothic New",sans-serif;--jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#000;color:var(--ink);font-family:var(--jp);font-weight:500;overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
#hud{position:fixed;inset:0;pointer-events:none;font-family:var(--num);text-shadow:0 1px 8px rgba(0,0,0,.8)}
#hud>*{position:absolute}
.L{left:max(16px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top))}
.R{right:max(16px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));text-align:right}
.k{font-size:11px;letter-spacing:.18em;color:var(--muted)}
.v{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.v small{font-size:15px;font-weight:500;color:var(--muted);margin-left:4px}
.row{display:flex;gap:18px;margin-top:8px}
.row .v{font-size:24px}
.warn{color:var(--am)}.bad{color:var(--red)}.good{color:var(--ok)}
.gauge{width:150px;height:6px;background:rgba(255,255,255,.16);margin:5px 0 10px auto;position:relative}
.gauge u{position:absolute;inset:0;background:var(--ink);transform-origin:left}
.gauge i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--am)}
#lamp{display:inline-block;margin-top:2px;padding:3px 10px;border:1px solid var(--line);font-size:12px;letter-spacing:.16em;color:var(--muted)}
#lamp.on{background:#6fd0ff;border-color:#6fd0ff;color:#001018;text-shadow:none}
#cap{top:max(64px,calc(env(safe-area-inset-top) + 56px));left:50%;transform:translateX(-50%);font-family:var(--jp);font-size:15px;letter-spacing:.06em;
  padding:6px 14px;background:rgba(0,0,0,.45);border-left:2px solid var(--am);white-space:nowrap;opacity:0;transition:opacity .3s}
#cap.on{opacity:1}
#tgt{left:0;top:0;width:0;height:0}
#tgt b{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border:2px solid var(--am);transform:rotate(45deg)}
#tgt span{position:absolute;left:16px;top:-9px;font-size:15px;font-weight:700;color:var(--am);white-space:nowrap}
#adi{left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);width:132px;height:132px}
.btns{right:max(16px,env(safe-area-inset-right));top:max(150px,calc(env(safe-area-inset-top) + 150px));display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.btns button,.yaw button{width:44px;height:44px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-size:12px;font-family:var(--jp)}
#stick{left:max(22px,env(safe-area-inset-left));bottom:max(26px,env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.05);pointer-events:auto}
#stick i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:rgba(255,255,255,.3)}
.yaw{left:max(22px,env(safe-area-inset-left));bottom:max(170px,calc(env(safe-area-inset-bottom) + 170px));display:flex;gap:44px;pointer-events:auto}
#thr{right:max(22px,env(safe-area-inset-right));bottom:max(26px,env(safe-area-inset-bottom));width:64px;height:210px;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:10px;pointer-events:auto}
#thr u{position:absolute;left:0;right:0;bottom:0;background:rgba(255,182,90,.35);border-radius:0 0 9px 9px}
#thr i{position:absolute;left:-5px;right:-5px;height:22px;margin-top:-11px;background:var(--ink);border-radius:5px}
#thr span{position:absolute;top:-22px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.14em;color:var(--muted)}
.ov{position:fixed;inset:0;display:grid;place-items:center;padding:20px;overflow:auto;touch-action:pan-y}
.ov.dim{background:rgba(0,0,0,.55)}
.card{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 24px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#menu{place-items:end start;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));background:linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,0) 75%)}
#menu .in{width:min(440px,100%);margin:auto 0}
.back{color:var(--muted);text-decoration:none;font-size:13px}
.back:hover{color:var(--ink)}
h1{font-family:var(--num);font-weight:700;font-size:clamp(34px,8vw,54px);letter-spacing:.06em;line-height:1;margin:18px 0 6px}
.sub{color:var(--muted);font-size:14px;margin:0 0 22px;line-height:1.7}
.ms{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.ms button{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 6px}
.ms button:hover,.ms button:focus-visible{background:rgba(255,255,255,.08);outline:none}
.ms .n{font-family:var(--num);font-size:24px;font-weight:700;color:var(--am)}
.ms b{display:block;font-size:16px;font-weight:700}
.ms small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.5}
.ms .g{font-family:var(--num);font-size:24px;font-weight:700;min-width:22px;text-align:center}
.opt{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{border:1px solid var(--line);background:rgba(0,0,0,.4);border-radius:999px;padding:7px 14px;font-size:13px}
.chip:hover{background:rgba(255,255,255,.1)}
h2{font-size:21px;margin:0 0 4px}
.card p{color:#cfccc3;font-size:14px;line-height:1.75;margin:8px 0}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px;margin:14px 0;color:#cfccc3}
.keys b{font-family:var(--num);font-size:14px;color:var(--ink);letter-spacing:.04em}
.act{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.pri{background:var(--am);color:#1a1206;border:0;border-radius:8px;padding:12px 22px;font-weight:700;font-size:15px}
.sec{background:none;border:1px solid var(--line);border-radius:8px;padding:12px 18px;font-size:14px}
.sec:hover{background:rgba(255,255,255,.08)}
.grade{font-family:var(--num);font-size:84px;font-weight:700;line-height:.9;float:right;margin-left:16px}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
td{padding:7px 0;border-top:1px solid var(--line)}
td:nth-child(2){text-align:right;font-family:var(--num);font-size:17px;font-variant-numeric:tabular-nums}
td:nth-child(3){text-align:right;font-family:var(--num);font-size:15px;color:var(--muted);width:64px}
#load{background:#000;font-size:14px;color:var(--muted);letter-spacing:.1em;text-align:center}
@media (max-width:640px){.v{font-size:34px}.row .v{font-size:20px}.gauge{width:110px}#adi{width:104px;height:104px}#cap{top:max(150px,calc(env(safe-area-inset-top) + 150px));font-size:13px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud" hidden>
  <div class="L">
    <div class="k">高度 ALT</div><div class="v"><span id="hAlt">0</span><small>m</small></div>

    </div>

  </div>

    <div class="k">燃料 FUEL <span id="hFt"></span></div><div class="gauge"><u id="gFuel"></u></div>

    <div class="k" id="hMode"></div>
  </div>
  <div class="btns"><button id="bPause" aria-label="一時停止">Ⅱ</button><button id="bView" aria-label="視点切替">視点</button><button id="bMute" aria-label="音">音</button></div>
  <div id="cap"></div>
  <div id="tgt"><b></b><span></span></div>
  <canvas id="adi" width="264" height="264"></canvas>
  <div class="yaw" id="yaw" hidden><button data-y="1">⟲</button><button data-y="-1">⟳</button></div>
  <div id="stick" hidden><i></i></div>
  <div id="thr" hidden><span>THR</span><u></u><i></i></div>
</div>

<div id="menu" class="ov" hidden><div class="in">
  <header><a class="back" href="/">← アプリ一覧</a></header>
  <h1>LUNA TOUCHDOWN</h1>
  <p class="sub">月面着陸シミュレーター。重力 1.62 m/s²、推力 45 kN。<br>燃料が尽きる前に、着陸船を目標へそっと降ろす。</p>
  <ul class="ms" id="ms"></ul>
  <div class="opt"><button class="chip" id="oMode"></button><button class="chip" id="oQ"></button></div>
</div></div>

<div id="brief" class="ov dim" hidden><div class="card">
  <h2 id="bT"></h2><p id="bD"></p>
  <div class="keys" id="bK"></div>
  <p style="font-size:13px;color:var(--muted)">着陸の条件：降下率 3 m/s 以下・水平 2 m/s 以下・傾き 12° 以下。<br>脚の探針が地面に触れると CONTACT が点灯します。点いたらエンジンを切ってください。</p>
  <div class="act"><button class="pri" id="bGo">降下開始</button><button class="sec" data-a="menu">ミッション選択</button></div>
</div></div>

<div id="pause" class="ov dim" hidden><div class="card">
  <h2>一時停止</h2>
  <div class="act"><button class="pri" data-a="resume">再開</button><button class="sec" data-a="retry">やり直す</button><button class="sec" data-a="menu">ミッション選択</button></div>
</div></div>

<div id="result" class="ov" hidden style="place-items:end center"><div class="card">
  <div class="grade" id="rG"></div>
  <h2 id="rT"></h2><p id="rD"></p>
  <table id="rS"></table>
  <div class="act"><button class="pri" data-a="retry">もう一度</button><button class="sec" data-a="next" id="rN">次のミッション</button><button class="sec" data-a="menu">ミッション選択</button></div>
</div></div>

<div id="load" class="ov">月面を生成しています…</div>

<script type="module">
import * as THREE from './vendor/three.module.min.js';
const $=s=>document.querySelector(s),V3=THREE.Vector3,clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const sstep=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)};
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ───────── Missions ───────── */
const MISSIONS=[
 {name:'はじめての降下',desc:'平らな盆地の上空 250 m から。まずは推力と姿勢の感覚をつかむ。',site:[3200,3400],alt:250,dist:340,vh:9,vd:3,fuel:520,sun:24,dir:[0,-1],exp:.65,earth:[-.45,.42,-.8]},
 {name:'標準進入',desc:'高度 600 m、秒速 42 m で進入。減速しながら 1.5 km 先の目標へ。',site:[9200,3800],alt:600,dist:1500,vh:42,vd:14,fuel:620,sun:18,dir:[-.5,-.87],exp:.72,earth:[-.7,.4,-.55]},
 {name:'クレーターの底へ',desc:'直径 1.4 km のクレーターの縁を越え、底の目標に降りる。',site:[5320,10660],alt:760,dist:1700,vh:45,vd:11,fuel:640,sun:30,dir:[-.8,-.6],exp:.55,earth:[-.8,.5,-.3]},
 {name:'尾根の一点',desc:'クレーターの縁、幅数十メートルの棚が目標。外せば急斜面。',site:[0,0],alt:560,dist:1600,vh:45,vd:10,fuel:560,sun:20,dir:[0,-1],exp:.7,earth:[-.3,.45,-.85]},
 {name:'明暗境界線',desc:'太陽高度 5.5°。長い影と逆光のなか、影に沈んだ地形を読む。',site:[13200,5200],alt:650,dist:1900,vh:50,vd:14,fuel:580,sun:5.5,dir:[.25,-.97],exp:1.4,earth:[-.6,.5,-.6]},
];
const RIM={c:[11800,11200],R:950,a:-.35};
MISSIONS[3].site=[RIM.c[0]+Math.cos(RIM.a)*RIM.R,RIM.c[1]+Math.sin(RIM.a)*RIM.R];

/* ───────── Terrain generation: three tiling height layers (16 km / 1.5 km / 192 m) ───────── */
function mkLayer(N,tile){return{N,tile,texel:tile/N,h:new Float32Array(N*N),alb:new Float32Array(N*N).fill(1),cl:new Float32Array(N*N)}}
function fbm(N,arr,amp,P,octs,gain,rnd){
  for(let o=0;o<octs&&P<=N/2;o++,P*=2,amp*=gain){
    const g=new Float32Array(P*P);for(let i=0;i<g.length;i++)g[i]=rnd()*2-1;
    const i0=new Int32Array(N),i1=new Int32Array(N),w=new Float32Array(N);
    for(let x=0;x<N;x++){const u=x/N*P,i=Math.floor(u),f=u-i;i0[x]=i%P;i1[x]=(i+1)%P;w[x]=f*f*f*(f*(f*6-15)+10)}
    for(let z=0;z<N;z++){const r0=i0[z]*P,r1=i1[z]*P,wz=w[z];let k=z*N;
      for(let x=0;x<N;x++,k++){const wx=w[x],a=g[r0+i0[x]],b=g[r0+i1[x]],c=g[r1+i0[x]],d=g[r1+i1[x]],t=a+(b-a)*wx;arr[k]+=amp*(t+(c+(d-c)*wx-t)*wz)}}
  }
}
function stamp(L,cx,cz,R,f,o={}){
  const N=L.N,t=L.texel,h=L.h,al=L.alb,mk=N-1;
  let base=0;for(let i=0;i<8;i++){const a=i*Math.PI/4;base+=h[((Math.round((cz+Math.sin(a)*R)/t)&mk)*N)+(Math.round((cx+Math.cos(a)*R)/t)&mk)]}base/=8;
  const depth=(o.depth??Math.min(.32*R,45+.12*R))*f,rim=(o.rim??.07*R)*f,fl=-depth*(o.floor??(R>350?.8:1.5)),er=o.erase??.75;
  const ext=R*2.6,x0=Math.floor((cx-ext)/t),x1=Math.ceil((cx+ext)/t),z0=Math.floor((cz-ext)/t),z1=Math.ceil((cz+ext)/t);
  const ph=cx*.37+cz*.11,bright=Math.max(0,f-.72)*1.1;
  for(let z=z0;z<=z1;z++)for(let x=x0;x<=x1;x++){
    const dx=x*t-cx,dz=z*t-cz,tt=Math.sqrt(dx*dx+dz*dz)/R;if(tt>=2.6)continue;const k=((z&mk)*N)+(x&mk);
    if(tt<1){let y=rim-(rim+depth)*(1-tt*tt);if(y<fl)y=fl;h[k]+=(base-h[k])*er*(1-sstep(.7,1,tt))+y;if(bright)al[k]+=bright*.45}
    else{const fo=1-sstep(1.5,2.6,tt);h[k]+=rim/(tt*tt*tt)*fo;if(bright){const an=Math.atan2(dz,dx);al[k]+=bright*fo/(tt*tt)*(.55+.45*Math.sin(an*9+ph)*Math.sin(an*5+ph*2))}}
  }
}
function craters(L,rnd,bins){for(const[n,r0,r1]of bins)for(let i=0;i<n;i++){const u=rnd();stamp(L,rnd()*L.tile,rnd()*L.tile,r0*Math.pow(r1/r0,u*u),.25+.75*rnd()**2)}}
function flatten(L,cx,cz,r0,r1){
  const N=L.N,t=L.texel,mk=N-1,hc=L.h[((Math.round(cz/t)&mk)*N)+(Math.round(cx/t)&mk)],e=Math.ceil(r1/t),ix=Math.round(cx/t),iz=Math.round(cz/t);
  for(let z=-e;z<=e;z++)for(let x=-e;x<=e;x++){const k=(((iz+z)&mk)*N)+((ix+x)&mk);L.h[k]+=(hc-L.h[k])*(1-sstep(r0,r1,Math.hypot(x,z)*t))}
}
const LA=mkLayer(1024,16384),LB=mkLayer(1024,1536),LC=mkLayer(512,192),LAYERS=[LA,LB,LC];
function generate(){
  let r=rng(7741);const N=LA.N,mask=new Float32Array(N*N);
  fbm(N,mask,1,3,3,.5,r);fbm(N,LA.h,260,4,8,.52,r);fbm(N,LA.alb,.07,8,5,.6,r);
  for(let k=0;k<N*N;k++){const m=sstep(-.2,.3,mask[k]);LA.h[k]*=.12+.88*m;LA.alb[k]+=-.22+.3*m}
  craters(LA,r,[[3,1200,1800],[10,600,1200],[40,300,600],[150,150,300],[520,60,150]]);
  flatten(LA,3200,3400,350,1100);flatten(LA,9200,3800,120,600);flatten(LA,13200,5200,220,900);
  stamp(LA,5200,10600,720,.95,{floor:.78,erase:.95});stamp(LA,RIM.c[0],RIM.c[1],RIM.R,.95,{erase:.9});
  flatten(LA,MISSIONS[3].site[0],MISSIONS[3].site[1],16,64);
  r=rng(991);fbm(LB.N,LB.h,3,4,7,.5,r);fbm(LB.N,LB.alb,.06,8,6,.6,r);
  craters(LB,r,[[10,26,40],[36,14,26],[140,7,14],[500,4,7],[1300,2.4,4]]);
  r=rng(3);fbm(LC.N,LC.h,.22,4,6,.5,r);fbm(LC.N,LC.alb,.05,8,5,.65,r);
  craters(LC,r,[[3,3,4.6],[14,1.5,3],[70,.8,1.5]]);
}
function bil(L,arr,x,z){
  const N=L.N,mk=N-1,px=x/L.texel,pz=z/L.texel,ix=Math.floor(px),iz=Math.floor(pz),fx=px-ix,fz=pz-iz,a=(iz&mk)*N,b=((iz+1)&mk)*N,i=ix&mk,j=(ix+1)&mk;
  const p=arr[a+i]+(arr[a+j]-arr[a+i])*fx;return p+(arr[b+i]+(arr[b+j]-arr[b+i])*fx-p)*fz;
}
const H=(x,z)=>bil(LA,LA.h,x,z)+bil(LB,LB.h,x,z)+bil(LC,LC.h,x,z);
function groundN(x,z,out){const e=.6;return out.set(H(x-e,z)-H(x+e,z),2*e,H(x,z-e)-H(x,z+e)).normalize()}
let tanE=.4;
function litAt(x,y,z){const a=y-H(x,z);let l=1;for(const L of LAYERS)l*=1-sstep(0,tanE*L.texel*1.5,bil(L,L.cl,x,z)-a);return l}
/* Sun sits along +x, so cast shadows are one horizon scan per row. */
function bakeShadow(L){
  const N=L.N,h=L.h,cl=L.cl,d=tanE*L.texel;
  for(let z=0;z<N;z++){const o=z*N;let s=-1e9;for(let p=0;p<2;p++)for(let x=N-1;x>=0;x--){s=Math.max(s-d,h[o+x]);if(p)cl[o+x]=s-h[o+x]}}
}
function mips(h,N){const out=[{data:h,width:N,height:N}];let s=h,n=N;while(n>1){const m=n>>1,d=new Float32Array(m*m);
  for(let z=0;z<m;z++)for(let x=0;x<m;x++){const k=2*z*n+2*x;d[z*m+x]=(s[k]+s[k+1]+s[k+n]+s[k+n+1])*.25}out.push({data:d,width:m,height:m});s=d;n=m}return out}

/* ───────── Renderer ───────── */
const canvas=$('#gl'),renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const hdrOK=renderer.extensions.has('EXT_color_buffer_float')||renderer.extensions.has('EXT_color_buffer_half_float');
const RTT=hdrOK?THREE.HalfFloatType:THREE.UnsignedByteType;
const coarse=matchMedia('(pointer:coarse)').matches;
const QL=[{n:'画質：高',dpr:2,msaa:4},{n:'画質：標準',dpr:1.5,msaa:2},{n:'画質：軽量',dpr:1,msaa:0}];
