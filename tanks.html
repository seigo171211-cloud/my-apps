<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>バウンスタンク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<link rel="stylesheet" href="arcade.css">
<style>
:root{--p1:#4fb3ff;--p2:#ff8a3d;--accent:#ffe14d;--glow:#ffb46b}
body{background:radial-gradient(1200px 600px at 50% -10%,#2a2516 0%,#0b0a07 62%)}
.hud{padding:.9cqw 1.6cqw}
.weap{font-size:1.15cqw;color:#fff;opacity:.9;min-height:1.6cqw}
.center b{font-size:1.5cqw}
.items{display:flex;gap:1.4cqw;justify-content:center;font-size:1.25cqw;color:var(--fg)}
.items span{background:var(--panel);border:1px solid var(--line);padding:.3cqw .9cqw;border-radius:999px}
</style>
</head>
<body>
<header class="bar">
  <a class="back" href="/">← アプリ一覧</a>
  <h1>バウンスタンク</h1>
  <div class="tools">
    <button class="chip" id="muteBtn">🔊 音 ON (M)</button>
    <button class="chip" id="pauseBtn">⏸ 一時停止 (Esc)</button>
  </div>
</header>
<div class="wrap">
<div class="frame">
  <canvas id="cv" width="1280" height="720"></canvas>
  <div class="hud">
    <div class="side" style="color:var(--p1)"><div class="pname" data-pname="0">PLAYER 1</div><div class="pips" id="pips0"></div><div class="weap" id="weap0"></div></div>
    <div class="center"><b id="mapLbl"></b><span id="roundLbl"></span></div>
    <div class="side r" style="color:var(--p2)"><div class="pname" data-pname="1">PLAYER 2</div><div class="pips" id="pips1"></div><div class="weap" id="weap1"></div></div>
  </div>

  <div class="ov" id="ovTitle">
    <h2 class="title">BOUNCE TANK</h2>
    <p class="sub">弾は壁で跳ね返る。跳弾で相手を撃ち抜け！ でも自分の弾にも当たるので注意。</p>
    <div class="ctrls">
      <div class="ctrl p1"><h3>PLAYER 1（青）</h3>
        前進・後退 <kbd>W</kbd><kbd>S</kbd>　回転 <kbd>A</kbd><kbd>D</kbd><br>
        発射 <kbd>F</kbd> / <kbd>Space</kbd>
        <div class="rdy" id="rdy0"></div></div>
      <div class="ctrl p2"><h3><span data-pname="1">PLAYER 2</span><span class="pcol">（オレンジ）</span></h3>
        前進・後退 <kbd>↑</kbd><kbd>↓</kbd>　回転 <kbd>←</kbd><kbd>→</kbd><br>
        発射 <kbd>Enter</kbd> / <kbd>/</kbd> / <kbd>0</kbd>
        <div class="rdy" id="rdy1"></div></div>
    </div>
    <div class="items"><span>🔱 3WAY 3発</span><span>⚡ レーザー</span><span>🛡 シールド</span><span>💨 ターボ</span></div>
    <div class="row">先取ラウンド
      <div class="seg" id="segWin"><button data-v="3">3</button><button data-v="5" aria-pressed="true">5</button><button data-v="7">7</button></div>
    </div>
    <p class="touchnote">※ キーボードのあるPCで遊んでください</p>
    <button class="btn" id="startBtn">スタート</button>
  </div>

  <div class="ov" id="ovPause" hidden>
    <p class="big">PAUSE</p>
    <div class="row"><button class="btn" id="resumeBtn">つづける</button><button class="btn ghost" id="quitBtn">タイトルへ</button></div>
    <p class="hint">Esc でもどる</p>
  </div>

  <div class="ov" id="ovEnd" hidden>
    <p class="sub">MISSION COMPLETE</p>
    <p class="big" id="endTitle"></p>
    <p class="sub" id="endScore"></p>
    <div class="ctrls"><div class="rdy" id="erdy0"></div><div class="rdy" id="erdy1"></div></div>
    <div class="row"><button class="btn" id="againBtn">もう一度</button><button class="btn ghost" id="titleBtn">タイトルへ</button></div>
  </div>
</div>
</div>
<script src="touch.js"></script>
<script src="cpu.js"></script>
<script src="arcade.js"></script>
<script>
const {tone,noise,show,hide,$}=Arcade;
const W=1280,H=720,S=80,GW=16,GH=9;
const COL=['#4fb3ff','#ff8a3d'],DARK=['#1d4f80','#8a3d12'];
const MAPS=[
 {name:'アリーナ',g:[
 '################',
 '#1.............#',
 '#..##......##..#',
 '#..#........#..#',
 '#......##......#',
 '#..#........#..#',
 '#..##......##..#',
 '#.............2#',
 '################']},
 {name:'クロスロード',g:[
 '################',
 '#1..#......#...#',
 '#...#..##..#...#',
 '#......##......#',
 '###..........###',
 '#......##......#',
 '#...#..##..#...#',
 '#...#......#..2#',
 '################']},
 {name:'ラビリンス',g:[
 '################',
 '#1.#.....#.....#',
 '#..#.###.#.###.#',
 '#..#...#...#...#',
 '#.####.#.#.#.###',
 '#......#.#.#...#',
 '#.###.##.#.###.#',
 '#.....#..#....2#',
 '################']},
 {name:'ピラーズ',g:[
 '################',
 '#1.............#',
 '#.#.#.#..#.#.#.#',
 '#..............#',
 '#.#.#.#..#.#.#.#',
 '#..............#',
 '#.#.#.#..#.#.#.#',
 '#.............2#',
 '################']},
 {name:'ツインルーム',g:[
 '################',
 '#1.....##.....2#',
 '#.####.##.####.#',
 '#.#..........#.#',
 '#....#....#....#',
 '#.#..........#.#',
 '#.####.##.####.#',
 '#......##......#',
 '################']},
];
const cv=$('cv'),ctx=cv.getContext('2d');
const mapCv=document.createElement('canvas');mapCv.width=W;mapCv.height=H;
const decal=document.createElement('canvas');decal.width=W;decal.height=H;const dctx=decal.getContext('2d');

let state='title',prevState='title',winTarget=5,round=1,map=null,mapOrder=[],cd=0,endT=0,roundWinner=-1,shake=0,time=0,itemT=0;
let bullets=[],parts=[],items=[],beams=[];
const TK=[0,1].map(i=>({i,score:0,x:0,y:0,a:0,alive:true,cool:0,weapon:null,ammo:0,shield:0,turbo:0,tread:0,recoil:0}));
const R=24;

const solid=(cx,cy)=>cx<0||cy<0||cx>=GW||cy>=GH||map.g[cy][cx]==='#';
const solidAt=(x,y)=>solid(Math.floor(x/S),Math.floor(y/S));

function buildMap(){
  const g=mapCv.getContext('2d');
  g.fillStyle='#1a1812';g.fillRect(0,0,W,H);
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    g.fillStyle=(x+y)%2?'#25221a':'#211e17';g.fillRect(x*S,y*S,S,S);
  }
  g.strokeStyle='rgba(255,255,255,.03)';
  for(let i=0;i<220;i++){g.beginPath();const x=Math.random()*W,y=Math.random()*H;g.arc(x,y,Math.random()*3,0,7);g.stroke()}
  // shadows
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++)if(solid(x,y)){g.fillStyle='rgba(0,0,0,.4)';g.fillRect(x*S+10,y*S+12,S,S)}
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++)if(solid(x,y)){
    g.fillStyle='#4a4436';g.fillRect(x*S,y*S,S,S);
    g.fillStyle='#5d5645';g.fillRect(x*S,y*S,S,S-10);
    if(!solid(x,y-1)){g.fillStyle='#7a7159';g.fillRect(x*S,y*S,S,4)}
    if(!solid(x-1,y)){g.fillStyle='#6b634e';g.fillRect(x*S,y*S,3,S-10)}
    if(!solid(x+1,y)){g.fillStyle='#3e392d';g.fillRect(x*S+S-3,y*S,3,S-10)}
    g.strokeStyle='rgba(0,0,0,.18)';g.lineWidth=1;
    for(let k=1;k<4;k++){g.beginPath();g.moveTo(x*S,y*S+k*17.5);g.lineTo(x*S+S,y*S+k*17.5);g.stroke()}
  }
  dctx.clearRect(0,0,W,H);
}
function pickMap(){if(!mapOrder.length){mapOrder=MAPS.map((_,i)=>i).sort(()=>Math.random()-.5)}map=MAPS[mapOrder.pop()];buildMap();$('mapLbl').textContent='MAP: '+map.name}

function startMatch(){TK.forEach(t=>t.score=0);round=1;mapOrder=[];hide('ovTitle');hide('ovEnd');paintPips();resetRound()}
function resetRound(){
  AI.path=[];AI.think=0;AI.fire=.9;AI.dodge=0;AI.pathT=0;
  pickMap();bullets=[];parts=[];items=[];beams=[];itemT=4+Math.random()*3;roundWinner=-1;
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const c=map.g[y][x];if(c==='1'||c==='2'){const t=TK[+c-1];t.x=x*S+S/2;t.y=y*S+S/2;t.a=c==='1'?0:Math.PI}}
  TK.forEach(t=>{t.alive=true;t.cool=0;t.weapon=null;t.ammo=0;t.shield=0;t.turbo=0;t.recoil=0});
  $('roundLbl').textContent='ROUND '+round;
  state='countdown';cd=2.4;lastN=4;paintWeap();
}
let lastN=4;
function paintPips(){for(let i=0;i<2;i++){const el=$('pips'+i);el.innerHTML='';for(let k=0;k<winTarget;k++){const d=document.createElement('i');d.className='pip'+(k<TK[i].score?' on':'');el.appendChild(d)}}}
const WNAME={triple:'🔱 3WAY',laser:'⚡ レーザー'};
function paintWeap(){for(const t of TK){let s=t.weapon?WNAME[t.weapon]+(t.weapon==='triple'?' ×'+t.ammo:''):'';if(t.shield>0)s+=' 🛡';if(t.turbo>0)s+=' 💨';$('weap'+t.i).textContent=s}}

const ready=Arcade.readyCheck(['rdy0','rdy1'],startMatch);
const ready2=Arcade.readyCheck(['erdy0','erdy1'],startMatch);
Arcade.on({
  press(p,a){
    if(state==='title'&&a==='act')ready.press(p);
    else if(state==='end'&&a==='act')ready2.press(p);
    else if((state==='play'||state==='roundEnd')&&a==='act')fire(TK[p]);
  },
  pause:togglePause,
  blur(){if(state==='play')togglePause()}
});

function fire(t){
  if(!t.alive||t.cool>0)return;
  const mx=t.x+Math.cos(t.a)*(R+12),my=t.y+Math.sin(t.a)*(R+12);
  if(t.weapon==='laser'){t.weapon=null;t.cool=.5;laser(t,mx,my);paintWeap();return}
  const mine=bullets.filter(b=>b.owner===t.i).length;
  if(t.weapon!=='triple'&&mine>=5){tone(90,.05,'square',.05);return}
  const angs=t.weapon==='triple'?[-.22,0,.22]:[0];
  for(const da of angs){
    const a=t.a+da;let bx=mx,by=my;
    if(solidAt(bx,by)){bx=t.x;by=t.y}
    bullets.push({x:bx,y:by,vx:Math.cos(a)*430,vy:Math.sin(a)*430,owner:t.i,age:0,bounces:0,trail:[]});
  }
  if(t.weapon==='triple'){t.ammo--;if(t.ammo<=0)t.weapon=null;paintWeap()}
  t.cool=.22;t.recoil=1;
  tone(t.i?220:200,.09,'square',.1,.4);noise(.08,.15,2500);
  for(let k=0;k<8;k++){const a=t.a+(Math.random()-.5)*.8,s=120+Math.random()*200;parts.push({x:mx,y:my,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.18,max:.18,c:'#ffe9a8',r:2.5})}
}
function laser(t,x,y){
  let a=t.a,dx=Math.cos(a),dy=Math.sin(a);const pts=[[x,y]];let dist=0,refl=0,hit=null;
  if(solidAt(x,y)){x=t.x;y=t.y}
  while(dist<2600&&refl<=4&&!hit){
    const nx=x+dx*3,ny=y+dy*3;
    if(solidAt(nx,ny)){
      const sx=solidAt(nx,y),sy=solidAt(x,ny);
      if(sx||!sy)dx=-dx; if(sy||!sx)dy=-dy;
      pts.push([x,y]);refl++;continue;
    }
    x=nx;y=ny;dist+=3;
    for(const o of TK){if(!o.alive)continue;if(o===t&&dist<60)continue;if(Math.hypot(o.x-x,o.y-y)<R){hit=o;break}}
  }
  pts.push([x,y]);
  beams.push({pts,life:.45,c:COL[t.i]});
  tone(1400,.35,'sawtooth',.09,.1);noise(.3,.2,5000);shake=Math.max(shake,6);
  if(hit)damage(hit,t.i);
}
function damage(t,by){
  if(t.shield>0){t.shield=0;paintWeap();tone(900,.2,'triangle',.12,.4);for(let k=0;k<24;k++){const a=Math.random()*7;parts.push({x:t.x+Math.cos(a)*R,y:t.y+Math.sin(a)*R,vx:Math.cos(a)*200,vy:Math.sin(a)*200,life:.4,max:.4,c:'#9ff',r:2})}return}
  explode(t);
}
function explode(t){
  t.alive=false;shake=22;
  noise(.9,.4,700);tone(90,.6,'sawtooth',.14,.3);
  for(let k=0;k<70;k++){const a=Math.random()*7,s=60+Math.random()*420;parts.push({x:t.x,y:t.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4+Math.random()*.8,max:1.2,c:['#fff4c2','#ffb13b','#ff5a1f',COL[t.i]][k%4],r:2+Math.random()*4})}
  for(let k=0;k<16;k++){const a=Math.random()*7,s=20+Math.random()*80;parts.push({smoke:true,x:t.x,y:t.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1+Math.random(),max:2,r:14+Math.random()*16})}
  dctx.fillStyle='rgba(0,0,0,.45)';dctx.beginPath();dctx.arc(t.x,t.y,46,0,7);dctx.fill();
  if(state==='play'){state='roundEnd';endT=1.8}
}
// ---------- CPU (drives tank 2) ----------
const AI={think:0,fire:0,aimA:null,path:[],pathT:0,dodge:0,dodgeA:0};
const wrapA=a=>((a%(Math.PI*2))+Math.PI*3)%(Math.PI*2)-Math.PI;
// Trace a shot like a real bullet; 'op' if it reaches the opponent first, 'self' if it comes back to the shooter.
function simShot(me,a,maxB){
  let x=me.x+Math.cos(a)*(R+12),y=me.y+Math.sin(a)*(R+12);if(solidAt(x,y)){x=me.x;y=me.y}
  let vx=Math.cos(a)*4,vy=Math.sin(a)*4,b=0;const op=TK[1-me.i];
  for(let dist=0;dist<2400;dist+=4){
    x+=vx;if(solidAt(x,y)){x-=vx;vx=-vx;b++}
    y+=vy;if(solidAt(x,y)){y-=vy;vy=-vy;b++}
    if(b>maxB)return null;
    if(op.alive&&Math.hypot(op.x-x,op.y-y)<R+2)return'op';
    if(dist>70&&Math.hypot(me.x-x,me.y-y)<R+6)return'self';
  }
  return null;
}
function threat(me,horizon){
  for(const bl of bullets){
    let x=bl.x,y=bl.y,vx=bl.vx/430*4,vy=bl.vy/430*4;
    for(let k=0,n=horizon*430/4;k<n;k++){
      x+=vx;if(solidAt(x,y)){x-=vx;vx=-vx}
      y+=vy;if(solidAt(x,y)){y-=vy;vy=-vy}
      if(Math.hypot(me.x-x,me.y-y)<R+10)return{vx,vy};
    }
  }
  return null;
}
function bfsPath(me,tx,ty){
  const sx=Math.floor(me.x/S),sy=Math.floor(me.y/S),gx=Math.floor(tx/S),gy=Math.floor(ty/S);
  const prev=new Int16Array(GW*GH).fill(-1),q=[sy*GW+sx];prev[q[0]]=q[0];
  for(let h=0;h<q.length;h++){const c=q[h];if(c===gy*GW+gx)break;const x=c%GW,y=(c/GW)|0;
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,n=ny*GW+nx;if(!solid(nx,ny)&&prev[n]<0){prev[n]=c;q.push(n)}}}
  if(prev[gy*GW+gx]<0)return[];
  const path=[];for(let c=gy*GW+gx;c!==sy*GW+sx;c=prev[c])path.unshift([(c%GW)*S+S/2,((c/GW)|0)*S+S/2]);
  return path;
}
function cpuTank(me,dt){
  const op=TK[0],L=CpuMode.lv;
  AI.think-=dt;AI.fire-=dt;AI.pathT-=dt;
  if(!op.alive)return{turn:0,drive:0};
  if(AI.think<=0){
    AI.think=L(.35,.18,.08);
    if(AI.dodge<=0&&Math.random()<L(.12,.55,.95)){const th=threat(me,L(.4,.6,.9));
      if(th){const a=Math.atan2(th.vy,th.vx)+Math.PI/2;AI.dodgeA=[a,a+Math.PI].find(o=>!solidAt(me.x+Math.cos(o)*S*.8,me.y+Math.sin(o)*S*.8))??a;AI.dodge=.35}}
    const direct=Math.atan2(op.y-me.y,op.x-me.x);
    AI.aimA=null;
    if(simShot(me,direct,0)==='op')AI.aimA=direct+(Math.random()-.5)*L(.4,.12,.03);
    else if(CpuMode.level>0){const n=L(0,24,48),maxB=L(0,1,3);let bd=9;
      for(let k=0;k<n;k++){const a=me.a+k/n*Math.PI*2;if(simShot(me,a,maxB)==='op'){const d=Math.abs(wrapA(a-me.a));if(d<bd){bd=d;AI.aimA=a}}}}
    if(AI.pathT<=0){AI.pathT=.5;let tg=op;
      if(CpuMode.level>0)for(const it of items)if(Math.hypot(it.x-me.x,it.y-me.y)<Math.hypot(tg.x-me.x,tg.y-me.y)*.8)tg=it;
      AI.path=bfsPath(me,tg.x,tg.y)}
  }
  if(AI.fire<=0){
    if(AI.aimA!==null&&CpuMode.level>0&&Math.abs(wrapA(AI.aimA-me.a))<.03)me.a=AI.aimA; // settle the last hair of aim
    const r=simShot(me,me.a,L(0,1,3));
    if(r==='op'||(CpuMode.level===0&&AI.aimA!==null&&Math.abs(wrapA(AI.aimA-me.a))<.25&&Math.random()<.4)){fire(me);AI.fire=L(1,.5,.28)}
    else AI.fire=.06;
  }
  let want,drive=1;
  if(AI.dodge>0){AI.dodge-=dt;want=AI.dodgeA}
  else if(AI.aimA!==null){want=AI.aimA;drive=0}
  else{while(AI.path.length&&Math.hypot(AI.path[0][0]-me.x,AI.path[0][1]-me.y)<26)AI.path.shift();
    want=AI.path.length?Math.atan2(AI.path[0][1]-me.y,AI.path[0][0]-me.x):Math.atan2(op.y-me.y,op.x-me.x)}
  const d=wrapA(want-me.a);
  return{turn:Math.max(-1,Math.min(1,d*2.5)),drive:drive&&Math.abs(d)<.9?1:0};
}
function moveTank(t,dt){
  const ax=Arcade.axis(t.i);
  let turn=ax.x,drive=-ax.y;
  const sk=TouchPad.stick[t.i];
  if(sk.on&&(sk.x||sk.y)){ // touch stick: point where you want to go
    const d=((Math.atan2(sk.y,sk.x)-t.a)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI;
    turn=Math.max(-1,Math.min(1,d*2.5));drive=Math.abs(d)<1.1?Math.min(1,Math.hypot(sk.x,sk.y)*1.3):0;
  }
  if(CpuMode.on&&t.i===1){const c=cpuTank(t,dt);turn=c.turn;drive=c.drive}
  const sp=(t.turbo>0?1.55:1);
  t.a+=turn*3.3*dt*(t.turbo>0?1.25:1);
  const v=drive*(drive>0?200:150)*sp;
  const ox=t.x,oy=t.y;
  t.x+=Math.cos(t.a)*v*dt;t.y+=Math.sin(t.a)*v*dt;
  for(let k=0;k<2;k++)pushOut(t);
  const o=TK[1-t.i];
  if(o.alive){const dx=t.x-o.x,dy=t.y-o.y,d=Math.hypot(dx,dy);if(d<R*2&&d>0){const p=(R*2-d)/2;t.x+=dx/d*p;t.y+=dy/d*p;o.x-=dx/d*p;o.y-=dy/d*p;pushOut(o);pushOut(t)}}
  const moved=Math.hypot(t.x-ox,t.y-oy);
  if(moved>0||turn){t.tread+=moved+Math.abs(turn)*2;
    if(Math.floor(t.tread/14)!==Math.floor((t.tread-moved-Math.abs(turn)*2)/14)){
      dctx.fillStyle='rgba(0,0,0,.16)';
      const px=-Math.sin(t.a),py=Math.cos(t.a);
      for(const s of[-1,1]){dctx.save();dctx.translate(t.x+px*s*16,t.y+py*s*16);dctx.rotate(t.a);dctx.fillRect(-3,-4,6,8);dctx.restore()}
    }
  }
}
function pushOut(o){
  const x0=Math.floor((o.x-R)/S),x1=Math.floor((o.x+R)/S),y0=Math.floor((o.y-R)/S),y1=Math.floor((o.y+R)/S);
  for(let cy=y0;cy<=y1;cy++)for(let cx=x0;cx<=x1;cx++){
    if(!solid(cx,cy))continue;
    const px=Math.max(cx*S,Math.min(o.x,cx*S+S)),py=Math.max(cy*S,Math.min(o.y,cy*S+S));
    const dx=o.x-px,dy=o.y-py,d=Math.hypot(dx,dy);
    if(d<R){if(d===0){o.y-=R}else{o.x+=dx/d*(R-d);o.y+=dy/d*(R-d)}}
  }
}
function spawnItem(){
  const free=[];
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++)if(!solid(x,y)){const cx=x*S+S/2,cy=y*S+S/2;if(TK.every(t=>Math.hypot(t.x-cx,t.y-cy)>220))free.push([cx,cy])}
  if(!free.length)return;
  const [x,y]=free[Math.floor(Math.random()*free.length)];
  const types=['triple','laser','shield','turbo'];
  items.push({x,y,type:types[Math.floor(Math.random()*types.length)],t:0});
  tone(1200,.08,'sine',.08);tone(1600,.1,'sine',.08,1,.08);
}
const ICON={triple:'🔱',laser:'⚡',shield:'🛡',turbo:'💨'};

function update(dt){
  time+=dt;
  for(const q of parts){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;const f=q.smoke?.96:.9;q.vx*=f;q.vy*=f}
  parts=parts.filter(q=>q.life>0);
  for(const b of beams)b.life-=dt;beams=beams.filter(b=>b.life>0);
  shake=Math.max(0,shake-dt*55);
  if(state==='countdown'){cd-=dt;const n=Math.ceil(cd/0.8);if(n<lastN&&n>0){lastN=n;tone(440,.1,'square',.08)}if(cd<=0){state='play';tone(880,.2,'square',.1)}return}
  if(state!=='play'&&state!=='roundEnd')return;
  for(const t of TK){if(!t.alive)continue;t.cool-=dt;t.recoil=Math.max(0,t.recoil-dt*6);
    if(t.shield>0){t.shield-=dt;if(t.shield<=0)paintWeap()}
    if(t.turbo>0){t.turbo-=dt;if(t.turbo<=0)paintWeap()}
    moveTank(t,dt)}
  // items
  if(state==='play'){itemT-=dt;if(itemT<=0&&items.length<2){spawnItem();itemT=7+Math.random()*5}}
  for(const it of items){it.t+=dt;for(const t of TK){if(t.alive&&Math.hypot(t.x-it.x,t.y-it.y)<R+20){it.take=t}}}
  items=items.filter(it=>{if(!it.take)return true;const t=it.take;
    if(it.type==='triple'){t.weapon='triple';t.ammo=3}else if(it.type==='laser'){t.weapon='laser'}else if(it.type==='shield'){t.shield=10}else t.turbo=8;
    tone(660,.08,'square',.1);tone(990,.14,'square',.1,1,.07);paintWeap();return false});
  // bullets
  for(const b of bullets){
    b.age+=dt;
    const steps=Math.ceil(430*dt/4),h=dt/steps;let bounced=false;
    for(let s=0;s<steps&&!b.dead;s++){
      b.x+=b.vx*h;if(solidAt(b.x,b.y)){b.x-=b.vx*h;b.vx=-b.vx;bounced=true}
      b.y+=b.vy*h;if(solidAt(b.x,b.y)){b.y-=b.vy*h;b.vy=-b.vy;bounced=true}
      for(const t of TK){if(!t.alive)continue;if(t.i===b.owner&&b.age<.15)continue;
        if(Math.hypot(t.x-b.x,t.y-b.y)<R+3){b.dead=true;damage(t,b.owner);break}}
    }
    if(bounced){b.bounces++;if(b.bounces>4)b.dead=true;else tone(500+b.bounces*90,.03,'square',.04)}
    if(b.age>9)b.dead=true;
    b.trail.push(b.x,b.y);if(b.trail.length>16)b.trail.splice(0,2);
  }
  for(let i=0;i<bullets.length;i++)for(let j=i+1;j<bullets.length;j++){const a=bullets[i],c=bullets[j];if(!a.dead&&!c.dead&&Math.hypot(a.x-c.x,a.y-c.y)<8){a.dead=c.dead=true;for(let k=0;k<10;k++){const r=Math.random()*7;parts.push({x:a.x,y:a.y,vx:Math.cos(r)*160,vy:Math.sin(r)*160,life:.25,max:.25,c:'#fff',r:2})}tone(1200,.05,'square',.05,.5)}}
  for(const b of bullets)if(b.dead&&b.bounces>4){for(let k=0;k<5;k++){const r=Math.random()*7;parts.push({x:b.x,y:b.y,vx:Math.cos(r)*60,vy:Math.sin(r)*60,life:.2,max:.2,c:'#aaa',r:1.5})}}
  bullets=bullets.filter(b=>!b.dead);
  if(state==='roundEnd'){endT-=dt;if(endT<=0){
    const alive=TK.filter(t=>t.alive);
    if(roundWinner===-1&&alive.length===1){roundWinner=alive[0].i;TK[roundWinner].score++;paintPips();Arcade.jingle()}
    else if(roundWinner===-1)roundWinner=-2;
    state='roundResult';endT=1.8;
  }}
}
function postUpdate(dt){
  if(state==='roundResult'){endT-=dt;if(endT<=0){if(TK.some(t=>t.score>=winTarget))showEnd();else{round++;resetRound()}}}
}
function showEnd(){
  state='end';const w=TK[0].score>TK[1].score?0:1;
  const t=$('endTitle');t.textContent=CpuMode.winText(w);t.style.color=COL[w];t.style.textShadow=`0 0 3cqw ${COL[w]}`;
  $('endScore').textContent=`${TK[0].score} - ${TK[1].score}`;ready2.reset();show('ovEnd');Arcade.fanfare();
}

function drawTank(t){
  ctx.save();ctx.translate(t.x,t.y);
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(5,7,R+2,R,0,0,7);ctx.fill();
  ctx.rotate(t.a);
  // treads
  ctx.fillStyle='#16140f';ctx.fillRect(-22,-23,44,11);ctx.fillRect(-22,12,44,11);
  ctx.fillStyle='#3a362b';
  const off=(t.tread%8);
  for(let k=-22;k<22;k+=8){ctx.fillRect(k+off-4>-22?k+off-4:-22,-22,3,9);ctx.fillRect(k+off-4>-22?k+off-4:-22,13,3,9)}
  // body
  ctx.fillStyle=DARK[t.i];ctx.beginPath();ctx.roundRect(-19,-14,38,28,6);ctx.fill();
  ctx.fillStyle=COL[t.i];ctx.beginPath();ctx.roundRect(-17,-12,34,22,5);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(-15,-11,30,5);
  // barrel + turret
  const rc=t.recoil*6;
  ctx.fillStyle='#2b2820';ctx.fillRect(4-rc,-4,26,8);
  ctx.fillStyle='#d8d2bd';ctx.fillRect(24-rc,-4.5,7,9);
  ctx.fillStyle=DARK[t.i];ctx.beginPath();ctx.arc(-1,0,11,0,7);ctx.fill();
  ctx.fillStyle=COL[t.i];ctx.beginPath();ctx.arc(-1,0,8.5,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.4)';ctx.beginPath();ctx.arc(-3,-3,3,0,7);ctx.fill();
  ctx.restore();
  if(t.shield>0){const a=t.shield<2?(Math.sin(time*25)>0?.7:.2):.7;ctx.strokeStyle=`rgba(140,255,255,${a})`;ctx.lineWidth=3;ctx.shadowColor='#8ff';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(t.x,t.y,R+9,0,7);ctx.stroke();ctx.shadowBlur=0}
  if(t.turbo>0&&Math.random()<.5)parts.push({smoke:true,x:t.x-Math.cos(t.a)*20,y:t.y-Math.sin(t.a)*20,vx:0,vy:0,life:.4,max:.8,r:6});
  if(t.weapon){ctx.font='20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ICON[t.weapon],t.x,t.y-R-14)}
  if(state==='countdown'){ctx.font='800 20px "M PLUS Rounded 1c"';ctx.fillStyle=COL[t.i];ctx.textAlign='center';ctx.fillText(CpuMode.on?CpuMode.short(t.i):'P'+(t.i+1),t.x,t.y-R-16)}
}
function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  if(!map){ctx.fillStyle='#14120d';ctx.fillRect(0,0,W,H);ctx.restore();return}
  ctx.drawImage(mapCv,0,0);ctx.drawImage(decal,0,0);
  for(const it of items){
    const b=Math.sin(it.t*4)*4,s=Math.min(1,it.t*4);
    ctx.save();ctx.translate(it.x,it.y+b);ctx.scale(s,s);
    ctx.fillStyle='rgba(255,225,77,.18)';ctx.beginPath();ctx.arc(0,0,26+Math.sin(it.t*6)*3,0,7);ctx.fill();
    ctx.strokeStyle='#ffe14d';ctx.lineWidth=2.5;ctx.beginPath();ctx.roundRect(-18,-18,36,36,8);ctx.stroke();
    ctx.font='24px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ICON[it.type],0,1);
    ctx.restore();
  }
  for(const t of TK)if(t.alive)drawTank(t);
  // bullets
  for(const b of bullets){
    ctx.strokeStyle=COL[b.owner]+'88';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();
    for(let k=0;k<b.trail.length;k+=2)k?ctx.lineTo(b.trail[k],b.trail[k+1]):ctx.moveTo(b.trail[k],b.trail[k+1]);ctx.stroke();
    ctx.fillStyle='#1b1a16';ctx.beginPath();ctx.arc(b.x,b.y,6,0,7);ctx.fill();
    ctx.fillStyle='#f4efe0';ctx.beginPath();ctx.arc(b.x,b.y,4.2,0,7);ctx.fill();
  }
  for(const bm of beams){
    const a=bm.life/.45;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.strokeStyle=bm.c;ctx.globalAlpha=a;ctx.lineWidth=12*a+2;ctx.shadowColor=bm.c;ctx.shadowBlur=30;
    ctx.beginPath();bm.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();
    ctx.strokeStyle='#fff';ctx.lineWidth=3*a+1;ctx.shadowBlur=0;ctx.stroke();ctx.globalAlpha=1;
  }
  for(const q of parts){
    const a=Math.max(0,q.life/q.max);
    if(q.smoke){ctx.fillStyle=`rgba(60,56,48,${a*.5})`;ctx.beginPath();ctx.arc(q.x,q.y,q.r*(1.6-a*.6),0,7);ctx.fill()}
    else{ctx.globalAlpha=a;ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fill();ctx.globalAlpha=1}
  }
  ctx.restore();
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(state==='countdown'){
    const n=Math.ceil(cd/.8),f=(cd/.8)%1;
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,H/2-90,W,180);
    ctx.font=`400 ${110+f*30}px "Dela Gothic One"`;ctx.fillStyle='#fff';ctx.fillText(n,W/2,H/2-8);
    ctx.font='800 24px "M PLUS Rounded 1c"';ctx.fillStyle='#ffe14d';ctx.fillText(`ROUND ${round} ・ ${map.name}`,W/2,H/2+62);
  }
  if(state==='roundResult'){
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,H/2-90,W,180);
    ctx.font='400 80px "Dela Gothic One"';
    if(roundWinner>=0){ctx.fillStyle=COL[roundWinner];ctx.fillText(`${CpuMode.short(roundWinner)} がラウンド獲得!`,W/2,H/2-10)}
    else{ctx.fillStyle='#fff';ctx.fillText('相打ち!',W/2,H/2-10)}
    ctx.font='800 26px "M PLUS Rounded 1c"';ctx.fillStyle='#eee';ctx.fillText(`${TK[0].score}  -  ${TK[1].score}`,W/2,H/2+58);
  }
}
function togglePause(){
  if(state==='paused'){state=prevState;hide('ovPause');return}
  if(['play','countdown','roundEnd','roundResult'].includes(state)){prevState=state;state='paused';show('ovPause')}
}
function toTitle(){state='title';ready.reset();hide('ovPause');hide('ovEnd');show('ovTitle')}
$('pauseBtn').onclick=e=>{togglePause();e.target.blur()};
$('resumeBtn').onclick=togglePause;$('quitBtn').onclick=toTitle;$('titleBtn').onclick=toTitle;
$('againBtn').onclick=()=>{Arcade.unlock();startMatch()};$('startBtn').onclick=()=>{Arcade.unlock();startMatch()};
document.querySelectorAll('#segWin button').forEach(b=>b.onclick=()=>{winTarget=+b.dataset.v;document.querySelectorAll('#segWin button').forEach(x=>x.setAttribute('aria-pressed',x===b));paintPips()});
paintPips();pickMap();TK.forEach(t=>t.alive=false);
CpuMode.mount('tanks',$('segWin').parentNode,()=>{ready.reset();ready2.reset()});
Arcade.touch([{pad:'stick',act:'発射'},{pad:'stick',act:'発射'}],{note:'スマホは横向きで。スティックを倒した方向に戦車が進みます'});
Arcade.loop(dt=>{if(state!=='paused'){update(dt);postUpdate(dt)}draw()});
</script>
