<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>進捗マス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
/* Layout: header, board chips, progress summary, the "brush" (which status a tap applies), then the rows x columns grid. All data lives in localStorage. */
:root{
  --bg:#f1efea; --surface:#ffffff; --sunken:#e7e4dd; --fg:#18171c; --muted:#6c6975;
  --line:#d9d5cc; --accent:#d9573a; --accent-ink:#ffffff;
  --s0:#e7e4dd; --s0-ink:#6c6975; --s1:#f4c542; --s1-ink:#3d2e00; --s2:#5b8def; --s2-ink:#ffffff; --s3:#1f9e8f; --s3-ink:#ffffff;
  --f-display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131217; --surface:#1c1b22; --sunken:#0e0d12; --fg:#f0eee8; --muted:#8f8c99;
  --line:#2c2a35; --accent:#ff7b5c; --accent-ink:#1a0d07;
  --s0:#26242e; --s0-ink:#8f8c99; --s1:#d9a514; --s1-ink:#1f1700; --s2:#5b8def; --s2-ink:#07132b; --s3:#35b8a7; --s3-ink:#04201c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131217; --surface:#1c1b22; --sunken:#0e0d12; --fg:#f0eee8; --muted:#8f8c99;
  --line:#2c2a35; --accent:#ff7b5c; --accent-ink:#1a0d07;
  --s0:#26242e; --s0-ink:#8f8c99; --s1:#d9a514; --s1-ink:#1f1700; --s2:#5b8def; --s2-ink:#07132b; --s3:#35b8a7; --s3-ink:#04201c; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(48px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
header h1{font-family:var(--f-display);font-weight:800;font-size:22px;margin:0;letter-spacing:.02em}
header a{color:var(--muted);font-size:13px;text-decoration:none;white-space:nowrap}
h2{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:500;margin:0 0 8px}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13.5px;padding:7px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.chip[aria-pressed="true"]{color:var(--bg);background:var(--fg);border-color:var(--fg)}
.chip.add{border-style:dashed}
.btn{padding:10px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:800}
.btn.danger{color:var(--accent)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.sum{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sum .pct{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1.1}
.sum .pct small{font-size:14px;font-weight:500;color:var(--muted);margin-left:6px;font-family:var(--f-body)}
.sum .acts{display:flex;gap:8px}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--s0);margin:12px 0 10px;gap:2px}
.stack i{display:block;min-width:0;transition:flex-grow .25s}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px}
.legend b{color:var(--fg);font-weight:500}

.brush{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:var(--sunken);border-radius:12px;padding:3px;margin-bottom:6px}
.brush button{padding:10px 2px;border-radius:9px;font-size:13px;color:var(--muted);line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:4px}
.brush button i{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.08)}
.brush button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:500}
.help{font-size:12.5px;color:var(--muted);margin:0 0 14px}

.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:4px;text-align:center}
thead th{font-weight:500;font-size:13px;position:sticky;top:0;background:var(--surface);padding:8px 5px 4px}
tbody th{position:sticky;left:0;background:var(--surface);text-align:left;font-weight:500;font-size:13.5px;white-space:nowrap;z-index:1;padding-left:8px}
th button{padding:6px 8px;border-radius:8px;width:100%;text-align:inherit}
th button:hover{background:var(--sunken)}
td button{width:100%;min-width:52px;height:46px;border-radius:10px;font-size:12px;font-weight:500;transition:transform .08s}
td button:active{transform:scale(.93)}
.s0{background:var(--s0);color:var(--s0-ink)} .s1{background:var(--s1);color:var(--s1-ink)} .s2{background:var(--s2);color:var(--s2-ink)} .s3{background:var(--s3);color:var(--s3-ink)}
tfoot td{font-size:12px;color:var(--muted);padding:4px 5px 10px}
.empty{color:var(--muted);text-align:center;padding:36px 12px;font-size:14px}

dialog{border:0;border-radius:18px;padding:20px;width:min(520px,calc(100vw - 32px));background:var(--surface);color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{font-family:var(--f-display);font-weight:800;font-size:18px;margin:0 0 6px;letter-spacing:0;color:var(--fg)}
dialog label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
dialog input,dialog textarea{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
dialog textarea{resize:vertical;line-height:1.6}
dialog .row{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
dialog .row .grow{flex:1}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:14px;z-index:50;pointer-events:none}
@media (prefers-reduced-motion:reduce){.stack i,td button{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>進捗マス</h1>
    <a href="/">← アプリ一覧</a>
  </header>

  <div class="chips" id="boards"></div>

  <div id="main">
    <div class="card">
      <div class="sum">
        <div class="pct"><span id="pct">0%</span><small id="frac"></small></div>
        <div class="acts">
          <button class="btn" id="undoBtn" disabled>元に戻す</button>
          <button class="btn" id="editBtn">表を編集</button>
          <button class="btn primary" id="copyBtn">報告をコピー</button>
        </div>
      </div>
      <div class="stack" id="stack"></div>
      <div class="legend" id="legend"></div>
    </div>

    <h2>タップしたマスを</h2>
    <div class="brush" id="brush"></div>
    <p class="help">行や列の見出しをタップすると、その行・列をまとめて変えられます（「次へ」以外を選んでいるとき）。</p>

    <div class="gridwrap"><table id="grid"></table></div>
  </div>
  <p class="empty" id="none" hidden>表がまだありません。「＋ 新しい表」から作れます。</p>
</div>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dlgTitle">新しい表</h2>
    <label for="fName">表の名前</label>
    <input type="text" id="fName" maxlength="40" placeholder="例：○○大学 英語" required>
    <label for="fCols">列（1行にひとつ、またはカンマ区切り）</label>
    <textarea id="fCols" rows="3" placeholder="2025&#10;2024&#10;2023" required></textarea>
    <label for="fRows">行（1行にひとつ、またはカンマ区切り）</label>
    <textarea id="fRows" rows="4" placeholder="第1問&#10;第2問&#10;第3問A&#10;第3問B" required></textarea>
    <div class="row">
      <button type="button" class="btn danger" id="fDel">この表を削除</button>
      <span class="grow"></span>
      <button type="button" class="btn" id="fCancel">やめる</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</dialog>

<script>
'use strict';
const $ = id => document.getElementById(id);
const KEY = 'shinchoku-v1';
const ST = ['未着手', '作成中', '確認待ち', '完了'];
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => s.replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

// Rows and columns carry ids so a cell keeps its status when a label is renamed or reordered.
const mk = names => names.map(name => ({id: uid(), name}));
function seed(){
  const b = {id: uid(), name: 'サンプル大学 英語', cols: mk(['2025', '2024', '2023']), rows: mk(['第1問', '第2問', '第3問A', '第3問B']), cells: {}};
  b.rows.forEach(r => b.cells[r.id + '|' + b.cols[2].id] = 3);
  b.cells[b.rows[0].id + '|' + b.cols[1].id] = 2; b.cells[b.rows[1].id + '|' + b.cols[1].id] = 1;
  return {boards: [b], cur: b.id, brush: -1};
}
function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && Array.isArray(d.boards)) return d; }catch{}
  return seed();
}
let S = load(), undo = null, editing = null;
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch{} };
const board = () => S.boards.find(b => b.id === S.cur) || S.boards[0] || null;
const get = (b, r, c) => b.cells[r.id + '|' + c.id] | 0;

function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t); setTimeout(() => t.remove(), 1600);
}

function render(){
  const b = board();
  $('boards').innerHTML = S.boards.map(x => `<button class="chip" data-id="${x.id}" aria-pressed="${b && x.id === b.id}">${esc(x.name)}</button>`).join('') + '<button class="chip add" data-id="__new">＋ 新しい表</button>';
  $('main').hidden = !b; $('none').hidden = !!b;
  if(!b) return;
  const n = [0, 0, 0, 0], total = b.rows.length * b.cols.length;
  b.rows.forEach(r => b.cols.forEach(c => n[get(b, r, c)]++));
  $('pct').textContent = (total ? Math.round(n[3] / total * 100) : 0) + '%';
  $('frac').textContent = `完了 ${n[3]} / ${total}`;
  $('stack').innerHTML = [3, 2, 1, 0].map(s => `<i class="s${s}" style="flex-grow:${n[s]}"></i>`).join('');
  $('legend').innerHTML = [3, 2, 1, 0].map(s => `<span><i class="s${s}"></i>${ST[s]} <b>${n[s]}</b></span>`).join('');
  $('brush').innerHTML = `<button data-v="-1" aria-pressed="${S.brush === -1}"><i style="background:linear-gradient(135deg,var(--s1) 33%,var(--s2) 33% 66%,var(--s3) 66%)"></i>次へ</button>` +
    ST.map((t, s) => `<button data-v="${s}" aria-pressed="${S.brush === s}"><i class="s${s}"></i>${t}</button>`).join('');
  $('grid').innerHTML =
    `<thead><tr><th></th>${b.cols.map(c => `<th><button data-col="${c.id}">${esc(c.name)}</button></th>`).join('')}</tr></thead><tbody>` +
    b.rows.map(r => `<tr><th><button data-row="${r.id}">${esc(r.name)}</button></th>${b.cols.map(c => { const s = get(b, r, c); return `<td><button class="s${s}" data-cell="${r.id}|${c.id}" aria-label="${esc(r.name)} ${esc(c.name)}：${ST[s]}">${ST[s]}</button></td>`; }).join('')}</tr>`).join('') +
    `</tbody><tfoot><tr><td></td>${b.cols.map(c => `<td>${b.rows.filter(r => get(b, r, c) === 3).length}/${b.rows.length}</td>`).join('')}</tr></tfoot>`;
  $('undoBtn').disabled = !undo || undo.id !== b.id;
}
function change(b, fn){
  undo = {id: b.id, cells: {...b.cells}};
  fn(); save(); render();
}
$('grid').addEventListener('click', e => {
  const b = board(), t = e.target.closest('button'); if(!t || !b) return;
  if(t.dataset.cell){
    const k = t.dataset.cell;
    change(b, () => { b.cells[k] = S.brush === -1 ? ((b.cells[k] | 0) + 1) % 4 : S.brush; });
    return;
  }
  const row = t.dataset.row && b.rows.find(r => r.id === t.dataset.row), col = t.dataset.col && b.cols.find(c => c.id === t.dataset.col);
  if(!row && !col) return;
  if(S.brush === -1){ toast('まとめて変えるには、状態をひとつ選んでください'); return; }
  change(b, () => { if(row) b.cols.forEach(c => b.cells[row.id + '|' + c.id] = S.brush); else b.rows.forEach(r => b.cells[r.id + '|' + col.id] = S.brush); });
  toast(`「${(row || col).name}」をすべて ${ST[S.brush]} にしました`);
});
$('brush').addEventListener('click', e => { const t = e.target.closest('button'); if(t){ S.brush = +t.dataset.v; save(); render(); } });
$('undoBtn').onclick = () => { const b = board(); if(!undo || !b || undo.id !== b.id) return; b.cells = undo.cells; undo = null; save(); render(); toast('元に戻しました'); };
$('boards').addEventListener('click', e => {
  const t = e.target.closest('.chip'); if(!t) return;
  if(t.dataset.id === '__new'){ openDlg(null); return; }
  S.cur = t.dataset.id; save(); render();
});

// ---- report ----
function report(b){
  const total = b.rows.length * b.cols.length; let done = 0;
  const lines = b.cols.map(c => {
    const by = [[], [], [], []];
    b.rows.forEach(r => by[get(b, r, c)].push(r.name));
    done += by[3].length;
    const parts = by[3].length === b.rows.length ? ['すべて完了'] : by[0].length === b.rows.length ? ['すべて未着手']
      : [3, 2, 1, 0].filter(s => by[s].length).map(s => `${ST[s]} ${by[s].join('・')}`);
    return `${c.name}：${parts.join(' ／ ')}`;
  });
  return `【${b.name}】完了 ${done}/${total}（${total ? Math.round(done / total * 100) : 0}%）\n${lines.join('\n')}`;
}
$('copyBtn').onclick = async () => {
  const text = report(board()); let ok = false;
  try{ await navigator.clipboard.writeText(text); ok = true; }
  catch{
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); try{ ok = document.execCommand('copy'); }catch{} ta.remove();
  }
  toast(ok ? '報告をコピーしました' : 'コピーできませんでした');
};

// ---- create / edit ----
const split = v => [...new Set(v.split(/[\n,、，]/).map(s => s.trim()).filter(Boolean))].slice(0, 40);
function openDlg(b){
  editing = b;
  $('dlgTitle').textContent = b ? '表を編集' : '新しい表';
  $('fName').value = b ? b.name : '';
  $('fCols').value = b ? b.cols.map(c => c.name).join('\n') : '';
  $('fRows').value = b ? b.rows.map(r => r.name).join('\n') : '';
  $('fDel').hidden = !b;
  $('dlg').showModal(); $('fName').focus();
}
$('editBtn').onclick = () => openDlg(board());
$('fCancel').onclick = () => $('dlg').close();
$('form').addEventListener('submit', e => {
  const name = $('fName').value.trim(), cols = split($('fCols').value), rows = split($('fRows').value);
  if(!name || !cols.length || !rows.length){ e.preventDefault(); toast('名前・列・行を入力してください'); return; }
  // Keep the id (and so the status) of any row/column whose label is unchanged.
  const keep = (old, names) => names.map(n => (old || []).find(o => o.name === n) || {id: uid(), name: n});
  if(editing){
    editing.name = name; editing.cols = keep(editing.cols, cols); editing.rows = keep(editing.rows, rows);
    const live = new Set(editing.rows.flatMap(r => editing.cols.map(c => r.id + '|' + c.id)));
    for(const k in editing.cells) if(!live.has(k)) delete editing.cells[k];
  }else{
    const b = {id: uid(), name, cols: mk(cols), rows: mk(rows), cells: {}};
    S.boards.push(b); S.cur = b.id;
  }
  undo = null; save(); render(); toast('保存しました');
});
$('fDel').onclick = () => {
  if(!editing || !confirm(`「${editing.name}」を削除しますか？`)) return;
  S.boards = S.boards.filter(b => b !== editing); S.cur = S.boards[0] ? S.boards[0].id : null;
  undo = null; save(); $('dlg').close(); render(); toast('削除しました');
};

render();
</script>
</body>
</html>
