<style>

#ov{position:absolute;inset:0;pointer-events:none;font-family:var(--rd);font-weight:900;line-height:1.15}

await Promise.race([Promise.all([document.fonts.load('400 40px "Dela Gothic One"', texts), document.fonts.load('900 40px "M PLUS Rounded 1c"', texts)]), new Promise(r => setTimeout(r, 4000))]).catch(() => { });

const G = (parent, p = [0, 0, 0], r = [0, 0, 0]) => { const g = new THREE.Group(); g.position.set(...p); g.rotation.set(...r); parent && parent.add(g); return g; };

const olMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, uniforms: { th: { value: .014 } },
  vertexShader: 'uniform float th;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);mv.xyz+=normalize(normalMatrix*normal)*th;gl_Position=projectionMatrix*mv;}',
  fragmentShader: 'void main(){gl_FragColor=vec4(.16,.09,.07,1.);}'

const FONT_R = '900 %px "M PLUS Rounded 1c","Hiragino Sans",sans-serif', FONT_D = '%px "Dela Gothic One","M PLUS Rounded 1c","Hiragino Sans",sans-serif';
function tex(draw, w = 256, h = 256) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
function texText(lines, { w = 512, h = 256, bg = '#fff', fg = '#222', size = 90, font = FONT_D, border = null, vertical = false } = {}) {
  return tex((g, W, H) => {
    if (bg) { g.fillStyle = bg; g.fillRect(0, 0, W, H); }
    if (border) { g.strokeStyle = border; g.lineWidth = 16; g.strokeRect(8, 8, W - 16, H - 16); }
    g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = font.replace('%', size);
    if (vertical) { const ch = [...lines[0]]; ch.forEach((c, i) => g.fillText(c, W / 2, H * (i + .5) / ch.length + size * .04)); }
    else lines.forEach((l, i) => g.fillText(l, W / 2, H * (i + .5) / lines.length + size * .06));
  }, w, h);
}

/* sky dome */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color() }, bot: { value: new THREE.Color() } },
  vertexShader: 'varying float h;void main(){h=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader: 'uniform vec3 top;uniform vec3 bot;varying float h;void main(){float k=pow(clamp(h*1.25+.08,0.,1.),.6);gl_FragColor=vec4(mix(bot,top,k),1.);\n#include <colorspace_fragment>\n}'

const cA = new THREE.Color(), cB = new THREE.Color();

  scene.fog.color.copy(skyMat.uniforms.bot.value);

/* ---------- characters ---------- */
const starTex = tex((g, W) => {
  g.translate(W / 2, W / 2); const gr = g.createRadialGradient(0, 0, 0, 0, 0, W / 2); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.25, 'rgba(255,255,220,.5)'); gr.addColorStop(1, 'rgba(255,255,255,0)');

});
function buildElder(o) {

  mk(SPH, top, [0, .3, 0], [0, 0, 0], [.27, .34, .24], torso);
  if (o.apron) { mk(SPH, M(0xfffaf2), [0, .26, .045], [0, 0, 0], [.262, .31, .215], torso); mk(BOX, M(0xfffaf2), [0, .5, .0], [0, 0, 0], [.34, .05, .3], torso); }

    mk(SPH, skin, [.21 * s, -.01, 0], [0, 0, 0], [.03, .045, .04], head);

    mk(BOX, hair, [.078 * s, .088, .178], [0, 0, -.18 * s], [o.brow || .06, .014, .03], head).userData.noOL = true;

  P.mouth = mk(SPH, M(0x8a2a2a), [0, -.095, .194], [0, 0, 0], [.035, .01, .012], head); P.mouth.userData.noOL = true;
  if (o.gran) {
    mk(new THREE.SphereGeometry(.224, 28, 14, 0, PI * 2, 0, PI * .5), hair, [0, .008, -.012], [-.42, 0, 0], 1, head);
    P.bun = mk(SPH, hair, [0, .2, -.1], [0, 0, 0], .1, head); mk(CYL, M(0xd22a3a), [0, .22, -.1], [0, 0, 1.2], [.008, .32, .008], head); mk(SPH, M(0xd22a3a), [.15, .275, -.1], [0, 0, 0], .022, head);
    const gm = M(0xc8962a); P.lens = [];

    }

    P.star = flat(mk(PLANE, MB(0xffffff, { map: starTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false }), [.1, .04, .26], [0, 0, 0], 0, head)); P.star.userData.noOL = true; P.star.renderOrder = 50;
