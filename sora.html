<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>蒼穹ストライク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Portrait-first 3D jet shooter. three.js (vendored) + hand-written sky / terrain / ocean shaders and an HDR bloom chain. One finger drags the jet; guns and missiles fire on their own. */
:root{
  --ink:#eef4ff;--muted:#a9b8cf;--acc:#7fd8ff;--amb:#ffb547;--red:#ff4d5e;--grn:#5dffa8;--panel:rgba(8,14,26,.58);--line:rgba(170,200,255,.26);
  --num:"Rajdhani","Zen Kaku Gothic New",sans-serif;--jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#0a0f1a;color:var(--ink);font-family:var(--jp);font-weight:500;overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#vig{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(255,30,60,.6) 100%)}

#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 1px 5px rgba(0,0,0,.65)}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding:calc(10px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) 0 calc(14px + env(safe-area-inset-left,0px))}
.score{font:700 32px/1 var(--num);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.sub{font:700 14px/1.2 var(--num);letter-spacing:.1em;color:var(--muted);margin-top:4px}
.sub b{color:var(--amb);font-size:17px}
.btns{display:flex;gap:8px}
.ic{pointer-events:auto;width:42px;height:42px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#boss{position:absolute;left:50%;top:calc(72px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(78vw,380px);text-align:center}
#boss .nm{font:700 13px var(--num);letter-spacing:.24em;color:#ffd0d4}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:4px;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.bar i{display:block;height:100%;width:100%;transform-origin:left;border-radius:3px}
#boss .bar i{background:linear-gradient(90deg,#ff8a4a,#ff3d5a)}
.bot{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 calc(14px + env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px))}
.stat{width:min(46vw,230px)}
.lbl{display:flex;justify-content:space-between;font:700 12px var(--num);letter-spacing:.18em;color:var(--muted)}
#armor i{background:linear-gradient(90deg,#4fe0a0,#b8ffd9);transition:transform .15s}
#armor.low i{background:linear-gradient(90deg,#ff3d5a,#ff9a6a)}
.pips{display:flex;gap:4px;margin-top:7px}
.pips i{width:16px;height:5px;border-radius:2px;background:rgba(255,255,255,.2)}
.pips i.on{background:var(--amb);box-shadow:0 0 8px rgba(255,181,71,.8)}
#burstBtn{pointer-events:auto;--p:0;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:conic-gradient(var(--acc) calc(var(--p)*1%),rgba(255,255,255,.14) 0);opacity:.75}
#burstBtn::before{content:"";position:absolute;inset:5px;border-radius:50%;background:rgba(8,14,26,.82)}
#burstBtn span{position:relative;font:700 12px var(--num);letter-spacing:.14em;color:var(--muted)}
#burstBtn.ready{opacity:1;box-shadow:0 0 22px rgba(127,216,255,.8);animation:pulse 1s infinite}
#burstBtn.ready span{color:#fff}
@keyframes pulse{50%{box-shadow:0 0 34px rgba(127,216,255,1)}}
#banner{position:fixed;left:0;right:0;top:27%;text-align:center;pointer-events:none;opacity:0}
#banner.show{animation:ban var(--d,2.6s) ease both}
#banner b{display:block;font:700 clamp(30px,9vw,56px)/1 var(--num);letter-spacing:.16em;text-shadow:0 2px 18px rgba(0,0,0,.6)}
#banner small{display:block;margin-top:8px;font-size:15px;letter-spacing:.3em;color:#dfe9ff;text-shadow:0 1px 8px rgba(0,0,0,.8)}
#banner.warn b{color:var(--red);animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
@keyframes ban{0%{opacity:0;transform:scale(1.15);letter-spacing:.4em}15%,80%{opacity:1;transform:none}100%{opacity:0}}

.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  padding:calc(14px + env(safe-area-inset-top,0px)) 20px calc(26px + env(safe-area-inset-bottom,0px));text-align:center}
.ov.dim{background:rgba(5,9,18,.62);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);justify-content:center;gap:14px}
#title{background:linear-gradient(180deg,rgba(5,9,18,.5),transparent 32%,transparent 52%,rgba(5,9,18,.82))}
header{align-self:stretch;display:flex;justify-content:space-between;align-items:center}
.back{color:var(--ink);text-decoration:none;font-size:14px;padding:8px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
h1{margin:9vh 0 0;font:700 clamp(40px,12vw,76px)/1.05 var(--jp);letter-spacing:.06em;text-shadow:0 3px 24px rgba(0,0,0,.55)}
h1 small{display:block;font:700 clamp(13px,3.6vw,18px) var(--num);letter-spacing:.5em;color:var(--acc);margin-bottom:10px;padding-left:.5em}
.tag{margin:12px 0 0;color:#dbe6fa;letter-spacing:.2em;font-size:14px;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.grow{flex:1}
.best{font:700 15px var(--num);letter-spacing:.2em;color:var(--muted)}
.best b{color:var(--ink);font-size:22px;margin-left:6px}
.btn{pointer-events:auto;min-width:220px;padding:15px 28px;border-radius:14px;font-weight:700;font-size:17px;letter-spacing:.14em;color:#06121c;
  background:linear-gradient(180deg,#bfeaff,#6fcfff);box-shadow:0 6px 26px rgba(80,190,255,.45);text-decoration:none;display:inline-block}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn:active{transform:translateY(1px)}
.how{margin:14px 0 0;padding:0;list-style:none;font-size:13px;line-height:1.9;color:#cfdbf0;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.how b{color:#fff}
.how .pc{color:var(--muted);font-size:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 3px 0 8px}
h2{margin:0;font:700 34px var(--num);letter-spacing:.2em}
.res{font:700 54px/1 var(--num);letter-spacing:.04em}
.resub{color:var(--muted);font-size:14px;letter-spacing:.12em;line-height:1.8}
.new{color:var(--amb);font:700 15px var(--num);letter-spacing:.3em}
.col{display:flex;flex-direction:column;gap:10px;margin-top:8px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="vig"></div>

<div id="hud" hidden>
  <div class="top">
    <div><div class="score" id="score">0</div><div class="sub"><span id="stg">STAGE 1</span> · <b id="mult">×1.0</b></div></div>
    <div class="btns">
      <button class="ic" id="muteBtn" aria-label="サウンド"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="muteW" d="M16.5 8.5a5 5 0 0 1 0 7"/></svg></button>
      <button class="ic" id="pauseBtn" aria-label="ポーズ"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
    </div>
  </div>
  <div id="boss" hidden><div class="nm">AERIAL FORTRESS</div><div class="bar"><i id="bossFill"></i></div></div>
  <div class="bot">
    <div class="stat">
      <div class="lbl"><span>ARMOR</span><span id="hpTxt">100</span></div>
      <div class="bar" id="armor"><i id="hpFill"></i></div>
      <div class="pips" id="pips"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <button id="burstBtn" aria-label="バースト"><span>BURST</span></button>
  </div>
</div>
<div id="banner"><b></b><small></small></div>

<div id="title" class="ov">
  <header><a class="back" href="/">← アプリ一覧</a></header>
  <h1><small>SOUKYU STRIKE</small>蒼穹ストライク</h1>
  <p class="tag">指一本で、空を裂け。</p>
  <div class="grow"></div>
  <div class="best">BEST<b id="bestT">0</b></div>
  <div class="col"><button class="btn" id="startBtn">出撃する</button></div>
  <ul class="how">
    <li><b>ドラッグ</b>で移動（射撃とミサイルは自動）</li>
    <li><b>ダブルタップ</b>か右下ボタンでバースト（弾消し）</li>
    <li><span class="dot" style="background:#ffb547"></span>武装強化<span class="dot" style="background:#5dffa8"></span>修理<span class="dot" style="background:#7fd8ff"></span>バースト</li>
    <li class="pc">PC: マウスドラッグ / WASD・矢印で移動、Spaceでバースト、Escでポーズ</li>
  </ul>
</div>

<div id="pause" class="ov dim" hidden>
  <h2>PAUSED</h2>
  <div class="col"><button class="btn" id="resumeBtn">つづける</button><button class="btn ghost" id="restartBtn">最初から</button><a class="btn ghost" href="/">← アプリ一覧</a></div>
</div>

<div id="over" class="ov dim" hidden>
  <h2>MISSION END</h2>
  <div class="new" id="newRec" hidden>NEW RECORD</div>
  <div class="res" id="resScore">0</div>
  <div class="resub" id="resSub"></div>
  <div class="col"><button class="btn" id="retryBtn">もう一度</button><a class="btn ghost" href="/">← アプリ一覧</a></div>
</div>

<script type="module">
import * as THREE from './vendor/three.module.min.js';

// ───────────────────────── helpers
const $=id=>document.getElementById(id);
const TAU=Math.PI*2,PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const damp=(a,b,k,dt)=>lerp(a,b,1-Math.exp(-k*dt));
const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>PI)d-=TAU;if(d<-PI)d+=TAU;return d};
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const isTouch=matchMedia('(hover:none) and (pointer:coarse)').matches||(navigator.maxTouchPoints>0&&/Macintosh/.test(navigator.userAgent));
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const t1=new THREE.Vector3();

// ───────────────────────── renderer + HDR bloom chain
const canvas=$('game');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
const hdrOK=renderer.capabilities.isWebGL2&&(renderer.extensions.has('EXT_color_buffer_float')||renderer.extensions.has('EXT_color_buffer_half_float'));
// Quality ladder: the frame timer steps down one rung at a time when the device can't keep up.
const QL=[{dpr:.75,msaa:0,bloom:false},{dpr:1,msaa:0,bloom:true},{dpr:1.35,msaa:0,bloom:true},{dpr:isTouch?1.7:2,msaa:4,bloom:true}];
let qi=hdrOK?(isTouch?2:3):0,Q=QL[qi];
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x888888,.0005);
const camera=new THREE.PerspectiveCamera(60,1,1,9000);

const fsGeo=new THREE.BufferGeometry();fsGeo.setAttribute('position',new THREE.Float32BufferAttribute([-1,-1,0,3,-1,0,-1,3,0],3));
const fsMesh=new THREE.Mesh(fsGeo);fsMesh.frustumCulled=false;
const fsScene=new THREE.Scene();fsScene.add(fsMesh);const fsCam=new THREE.Camera();
const FSV='varying vec2 vUv;void main(){vUv=position.xy*.5+.5;gl_Position=vec4(position.xy,0.,1.);}';
const fsMat=(frag,uniforms)=>new THREE.ShaderMaterial({vertexShader:FSV,fragmentShader:frag,uniforms,depthTest:false,depthWrite:false});
const matDown=fsMat(`varying vec2 vUv;uniform sampler2D tex;uniform vec2 texel;uniform float thr;
vec3 s(vec2 o){return texture2D(tex,vUv+o*texel).rgb;}
void main(){vec3 c=(s(vec2(-1.,-1.))+s(vec2(1.,-1.))+s(vec2(-1.,1.))+s(vec2(1.,1.)))*.25;
if(thr>0.){float b=max(c.r,max(c.g,c.b));c*=max(b-thr,0.)/max(b,1e-4);c=min(c,vec3(24.));}
gl_FragColor=vec4(c,1.);}`,{tex:{value:null},texel:{value:new THREE.Vector2()},thr:{value:0}});
const matUp=fsMat(`varying vec2 vUv;uniform sampler2D tA,tB;uniform vec2 texel;
vec3 s(vec2 o){return texture2D(tB,vUv+o*texel).rgb;}
void main(){vec3 b=s(vec2(0.))*4.+(s(vec2(1.,0.))+s(vec2(-1.,0.))+s(vec2(0.,1.))+s(vec2(0.,-1.)))*2.+s(vec2(1.,1.))+s(vec2(-1.,1.))+s(vec2(1.,-1.))+s(vec2(-1.,-1.));
gl_FragColor=vec4(texture2D(tA,vUv).rgb+b/16.,1.);}`,{tA:{value:null},tB:{value:null},texel:{value:new THREE.Vector2()}});
const matOut=fsMat(`varying vec2 vUv;uniform sampler2D tS,tB;uniform float bloom,ca,hurt,time,flash;
vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}
float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
void main(){vec2 d=vUv-.5;float r2=dot(d,d);vec2 o=d*ca*r2;
vec3 c=vec3(texture2D(tS,vUv+o).r,texture2D(tS,vUv).g,texture2D(tS,vUv-o).b);
c+=texture2D(tB,vUv).rgb*bloom;
c*=1.-r2*.55;c=mix(c,c*vec3(1.6,.4,.4),hurt*smoothstep(.04,.5,r2));c+=flash*vec3(.8,.95,1.);
c=aces(c*1.1);c=pow(c,vec3(1./2.2));c+=(h(vUv*913.+time)-.5)/255.;
gl_FragColor=vec4(c,1.);}`,{tS:{value:null},tB:{value:null},bloom:{value:.11},ca:{value:0},hurt:{value:0},time:{value:0},flash:{value:0}});
let rtScene=null,mips=[],ups=[];
function buildTargets(){
  if(rtScene)rtScene.dispose();mips.concat(ups).forEach(r=>r.dispose());mips=[];ups=[];rtScene=null;
  if(!Q.bloom)return;
  const w=canvas.width,h=canvas.height,mk=(w,h)=>new THREE.WebGLRenderTarget(w,h,{type:THREE.HalfFloatType,depthBuffer:false});
  rtScene=new THREE.WebGLRenderTarget(w,h,{type:THREE.HalfFloatType,samples:Q.msaa});
  let mw=w>>1,mh=h>>1;
  for(let i=0;i<5;i++){mips.push(mk(mw,mh));ups.push(mk(mw,mh));mw=Math.max(2,mw>>1);mh=Math.max(2,mh>>1)}
}
function pass(mat,rt){fsMesh.material=mat;renderer.setRenderTarget(rt);renderer.render(fsScene,fsCam)}
function renderFrame(){
  if(!Q.bloom){renderer.setRenderTarget(null);renderer.render(scene,camera);return}
  renderer.setRenderTarget(rtScene);renderer.render(scene,camera);
  let src=rtScene;
  for(let i=0;i<5;i++){matDown.uniforms.tex.value=src.texture;matDown.uniforms.texel.value.set(1/src.width,1/src.height);matDown.uniforms.thr.value=i?0:1.15;pass(matDown,mips[i]);src=mips[i]}
  let low=mips[4];
  for(let i=3;i>=0;i--){matUp.uniforms.tA.value=mips[i].texture;matUp.uniforms.tB.value=low.texture;matUp.uniforms.texel.value.set(1/low.width,1/low.height);pass(matUp,ups[i]);low=ups[i]}
  matOut.uniforms.tS.value=rtScene.texture;matOut.uniforms.tB.value=low.texture;pass(matOut,null);
}
let camK=1,wpp=.1;
function resize(){
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,Q.dpr)*(Q.dpr<1?Q.dpr:1));
  renderer.setSize(innerWidth,innerHeight,false);
  const a=innerWidth/innerHeight;camera.aspect=a;camera.updateProjectionMatrix();
  camK=clamp(15/(29*a),.8,1.6);wpp=2*50.5*camK*Math.tan(PI/6)/innerHeight;
  buildTargets();
}
addEventListener('resize',resize);

// ───────────────────────── atmosphere: four times of day, lerped between stages
const ALT=40, SCROLL=58;
const hx=h=>{const c=new THREE.Color(h);return[c.r,c.g,c.b]};
const nrm=v=>{const l=Math.hypot(...v);return v.map(x=>x/l)};
const PRE=[
 {name:'夜明けの群島',zen:hx('#3b5b93'),hor:hx('#f2a57c'),sunDir:nrm([-.38,.11,-1]),sunCol:hx('#ffb273'),sunI:3,amb:hx('#8d93b4'),
  sand:hx('#cbb68c'),low:hx('#4c6c39'),rock:hx('#6d665e'),high:hx('#d9d5cc'),water:hx('#0d3548'),cloud:hx('#ffd3ba'),
  land:-.02,mtn:1,canyon:0,terr:0,night:0,fog:.00105,cy0:6,cy1:26,cs:1},
 {name:'真昼の峡谷',zen:hx('#2c6cc4'),hor:hx('#b7d3ee'),sunDir:nrm([.3,.85,-.42]),sunCol:hx('#fff3de'),sunI:3.3,amb:hx('#a2b8da'),
  sand:hx('#dcbd8e'),low:hx('#b57f4d'),rock:hx('#9b5b3b'),high:hx('#e3caa2'),water:hx('#1f6e7c'),cloud:hx('#ffffff'),
  land:.3,mtn:1,canyon:1,terr:1,night:0,fog:.0008,cy0:60,cy1:120,cs:.8},
 {name:'黄昏の雲海',zen:hx('#27235a'),hor:hx('#ff7d5c'),sunDir:nrm([.28,.055,-1]),sunCol:hx('#ff8c4c'),sunI:2.7,amb:hx('#7d6ca4'),
  sand:hx('#8b7b71'),low:hx('#3e4b3b'),rock:hx('#4f4b53'),high:hx('#f1e5f1'),water:hx('#1a2239'),cloud:hx('#ffb4a2'),
  land:.14,mtn:1.25,canyon:0,terr:0,night:0,fog:.0012,cy0:4,cy1:20,cs:1.7},
 {name:'夜間迎撃',zen:hx('#04070f'),hor:hx('#101a36'),sunDir:nrm([-.28,.42,-.86]),sunCol:hx('#a3b7ff'),sunI:1,amb:hx('#2a3452'),
  sand:hx('#3b3b41'),low:hx('#1f2b23'),rock:hx('#2d2d34'),high:hx('#8991a9'),water:hx('#050a14'),cloud:hx('#56628a'),
  land:.06,mtn:.85,canyon:0,terr:0,night:1,fog:.0013,cy0:8,cy1:30,cs:1},
];
const env={};
const u3=()=>({value:new THREE.Vector3()}),u1=()=>({value:0});
const U={uZen:u3(),uHor:u3(),uSunDir:u3(),uSunCol:u3(),uAmb:u3(),uSunI:u1(),uNight:u1(),uTime:u1(),uScroll:u1(),uFogD:u1(),
  cSand:u3(),cLow:u3(),cRock:u3(),cHigh:u3(),uWater:u3(),uLand:u1(),uMtn:u1(),uCanyon:u1(),uTerr:u1()};
const GLSL=`
uniform vec3 uZen,uHor,uSunDir,uSunCol,uAmb;uniform float uSunI,uNight,uTime,uScroll,uFogD;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);
return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x),u.y);}
vec3 skyCol(vec3 d){float h=max(d.y,0.);vec3 c=mix(uHor,uZen,pow(h,.5));float s=max(dot(d,uSunDir),0.);
c+=uSunCol*uSunI*(pow(s,8.)*.07+pow(s,90.)*.28+pow(s,3.)*exp(-h*6.)*.05);return c;}
vec3 fogIt(vec3 col,vec3 wp){vec3 v=wp-cameraPosition;float d=length(v);vec3 dir=v/d;float f=1.-exp(-d*uFogD);
return mix(col,skyCol(normalize(vec3(dir.x,max(dir.y,0.)*.3+.02,dir.z))),f);}
`;
const TAIL='\n#include <tonemapping_fragment>\n#include <colorspace_fragment>\n}';
const SKYF=env=>`varying vec3 vDir;${GLSL}
void main(){vec3 d=normalize(vDir);vec3 c=skyCol(d);
${env?'c=mix(c,uHor*.35+uAmb*.1,smoothstep(.02,-.12,d.y));':`
float s=dot(d,uSunDir);c+=uSunCol*uSunI*smoothstep(.99955,.9998,s)*mix(14.,5.,uNight);

const AU={ctx:null,muted:store.get('soukyu_mute','0')==='1',last:{}};
function auInit(){
  if(AU.ctx){AU.ctx.resume();return}
  try{AU.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  const c=AU.ctx;AU.master=c.createGain();AU.master.gain.value=AU.muted?0:.55;
  const comp=c.createDynamicsCompressor();AU.master.connect(comp);comp.connect(c.destination);
  const b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=b;
  const n=c.createBufferSource();n.buffer=b;n.loop=true;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;
  AU.eng=c.createGain();AU.eng.gain.value=0;n.connect(lp);lp.connect(AU.eng);AU.eng.connect(AU.master);n.start();
  const o=c.createOscillator();o.type='sawtooth';o.frequency.value=74;const og=c.createGain();og.gain.value=.05;const olp=c.createBiquadFilter();olp.type='lowpass';olp.frequency.value=260;o.connect(olp);olp.connect(og);og.connect(AU.eng);o.start();

function nz(dur,type,f0,f1,vol,q=.8){const c=AU.ctx,t=c.currentTime,s=c.createBufferSource();s.buffer=AU.noise;const f=c.createBiquadFilter();f.type=type;f.Q.value=q;
  f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(AU.master);s.start(t,Math.random());s.stop(t+dur+.02)}

  const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+dur+.02)}
const GAP={gun:.07,hit:.05,boom:.06,eshot:.09};
function sfx(n,v=1){
  if(!AU.ctx||AU.muted||AU.ctx.state!=='running')return;const now=AU.ctx.currentTime;if(GAP[n]){if(now-(AU.last[n]||0)<GAP[n])return;AU.last[n]=now}
  if(n==='gun'){nz(.06,'bandpass',1500+rnd(500),700,.11);tone('square',150,60,.05,.035)}
  else if(n==='hit')nz(.04,'highpass',3200,2400,.05);
  else if(n==='boom'){nz(.5+v*.8,'lowpass',1900,90,.5*v);tone('sine',95,28,.35+v*.3,.6*v)}
  else if(n==='missile')nz(.55,'bandpass',500,2600,.12,1.4);
  else if(n==='eshot')tone('triangle',520,260,.09,.035);
  else if(n==='pick'){tone('sine',660,660,.09,.14);tone('sine',990,990,.09,.14,.07);tone('sine',1320,1320,.16,.14,.14)}
  else if(n==='hurt'){tone('sawtooth',210,50,.3,.3);nz(.3,'lowpass',2600,200,.4)}
  else if(n==='burst'){tone('sine',160,1500,.5,.3);nz(1.3,'lowpass',5000,120,.55);tone('sine',70,26,.9,.6)}
  else if(n==='warn'){for(let i=0;i<4;i++){tone('square',760,760,.2,.09,i*.5);tone('square',570,570,.2,.09,i*.5+.25)}}
  else if(n==='clear'){[523,659,784,1047].forEach((f,i)=>tone('triangle',f,f,.3,.14,i*.11))}

  sweep:side=>(e,dt)=>{e.x-=side*(30-e.t*3)*dt;e.z+=(14+e.t*16)*dt;return e.z<62&&Math.abs(e.x)<70},
  hover:(xh,zh,stay)=>(e,dt)=>{

function addScore(v){const m=Math.min(5,1+Math.floor(G.chain/4)*.5);G.score+=Math.round(v*m)}

  const big=e.type==='gunship';explode(e.x,ALT,e.z,big?2.6:e.type==='drone'?.8:e.type==='hmis'?.5:1.15);

  part(addP,{x:P.x,y:ALT,z:P.z,life:.9,s0:3,s1:150,r:2.5,g:5,b:8,a:1,kind:2});part(addP,{x:P.x,y:ALT,z:P.z,life:.5,s0:6,s1:50,r:3,g:6,b:9});
  for(const b of ebul){part(addP,{x:b.x,y:ALT,z:b.z,life:.5,s0:1,s1:.2,r:2,g:5,b:8,vy:6});G.score+=10}ebul.length=0;
  for(const e of enemies.slice()){if(e.z<50&&e.z>-200){if(e.parts){for(const p of e.parts)if(p.hp>0&&(!p.core||e.parts.every(q=>q.core||q.hp<=0)))hitEnemy(e,45,e.x,e.z,p)}else hitEnemy(e,45,e.x,e.z)}}
}

const GUNS=[[-.38,-2.7,0],[.38,-2.7,0],[-1.6,-.4,0],[1.6,-.4,0],[-1.1,-1,-.07],[1.1,-1,.07],[-2.6,.4,-.14],[2.6,.4,.14],[0,-3.2,0]];
const NG=[2,4,6,8,9];
function fireGuns(){
  const n=NG[P.lvl-1];
  for(let i=0;i<n;i++){const g=GUNS[i],a=g[2]+rnd(-.012,.012);shots.push({x:P.x+g[0],z:P.z+g[1],vx:Math.sin(a)*270,vz:-Math.cos(a)*270,t:0})}
  part(addP,{x:P.x,y:ALT+.1,z:P.z-3.1,life:.05,s0:1.3,s1:.6,r:7,g:5,b:2.2});sfx('gun');
}
function fireMissiles(){
  const n=P.lvl>=4?4:2;let c=0;
  for(let i=0;i<n;i++){const s=i%2?1:-1;missiles.push({x:P.x+s*(1.8+(i>1?.8:0)),z:P.z+.8,vx:s*(12+i*3),vz:8,t:0,tg:null,h:PI});c++}
  if(c)sfx('missile');
}
function pickTarget(m){let best=null,bd=1e9;
  for(const e of enemies){if(e.dead||e.dying||e.z>m.z-4||e.z<-230)continue;let ex=e.x,ez=e.z,pt=null;
    if(e.parts){pt=e.parts.find(p=>!p.core&&p.hp>0)||e.parts[2];ex+=pt.dx;ez+=pt.dz}
    const d=Math.hypot(ex-m.x,ez-m.z)+(e.lock||0)*30;if(d<bd){bd=d;best=e;m.pt=pt}}
  if(best)best.lock=(best.lock||0)+1;return best}

    if(Math.floor(G.time*1.3)%2===0)ADD.add(wx,wy+.1,P.z+1.2,0,0,0,.5,sd<0?5:.4,sd<0?.4:5,.6,1)}

function segHit(x0,z0,x1,z1,cx,cz,r){const dx=x1-x0,dz=z1-z0,l=dx*dx+dz*dz;let t=l>0?((cx-x0)*dx+(cz-z0)*dz)/l:0;t=clamp(t,0,1);const ex=x0+dx*t-cx,ez=z0+dz*t-cz;return ex*ex+ez*ez<r*r}
function tryHit(x0,z0,x1,z1,dmg,pad){
  for(const e of enemies){if(e.dead||e.dying||e.z<-235)continue;
    if(e.parts){for(const p of e.parts)if(p.hp>0&&segHit(x0,z0,x1,z1,e.x+p.dx,e.z+p.dz,p.r+pad)){hitEnemy(e,dmg,x1,z1,p);return e}}
    else if(segHit(x0,z0,x1,z1,e.x,e.z,e.r+pad)){hitEnemy(e,dmg,x1,z1);return e}}
  return null}
function updateShots(dt){
  for(let i=shots.length-1;i>=0;i--){const s=shots[i],x0=s.x,z0=s.z;s.x+=s.vx*dt;s.z+=s.vz*dt;s.t+=dt;
    let gone=s.t>.85;if(!gone&&tryHit(x0,z0,s.x,s.z,1,.3)){sparks(s.x,s.z,2);gone=true}
    if(gone){shots[i]=shots[shots.length-1];shots.pop()}else ADD.add(s.x,ALT,s.z,s.vx*.026,0,s.vz*.026,.26,6,3.6,1.3,1)}
  for(let i=missiles.length-1;i>=0;i--){const m=missiles[i];m.t+=dt;const x0=m.x,z0=m.z;
    if(m.t>.16){if(!m.tg||m.tg.dead||m.tg.dying)m.tg=pickTarget(m);
      let want=PI;if(m.tg){const t=m.tg,pt=m.pt&&t.parts?m.pt:null;want=Math.atan2((t.x+(pt?pt.dx:0))-m.x,(t.z+(pt?pt.dz:0))-m.z)}
      m.h+=clamp(angDiff(want,m.h),-7*dt,7*dt);const sp=Math.min(170,40+m.t*260);m.vx=Math.sin(m.h)*sp;m.vz=Math.cos(m.h)*sp;

    m.x+=m.vx*dt;m.z+=m.vz*dt;
    let gone=m.t>2.6||m.z<-240;if(!gone&&tryHit(x0,z0,m.x,m.z,7,.6)){explode(m.x,ALT,m.z,.55,true);gone=true}
    if(gone){missiles[i]=missiles[missiles.length-1];missiles.pop()}
    else{ADD.add(m.x,ALT,m.z,m.vx*.012,0,m.vz*.012,.3,8,5,2,1);ADD.add(m.x,ALT,m.z,0,0,0,.9,5,2.5,.8,.6)}}
}

      e.mesh.position.x=e.x;e.mesh.position.z=e.z;continue}
    if(!e.beh(e,dt)){if(e.grp)e.grp.left--;removeEnemy(e);enemies.splice(i,1);continue}

    const vx=(e.x-e.px)/Math.max(dt,1e-4),vz=(e.z-e.pz)/Math.max(dt,1e-4),sp=Math.hypot(vx,vz);

        part(addP,{x:e.x+p.dx+rnd(-1,1),y:ALT+1.6,z:e.z+p.dz,vy:6,life:.4,s0:1.6,s1:.5,r:7,g:2.6,b:.5,cool:1,air:.4})}

}

function updateStage(dt){

  const len=46+Math.min(G.stage,3)*6;
  if(G.phase==='waves'){
    if((G.waveT-=dt)<=0&&G.t<len)nextWave();
    if(G.gunships===0&&G.t>len*.45&&G.stage>0){W.gunship()}
    if(G.gunships===0&&G.stage===0&&G.t>len*.6){W.gunship()}

}

const up=e=>{if(e.pointerId!==inp.id)return;inp.id=null;const now=performance.now();if(now-inp.st<240&&inp.moved<14){inp.tapT=now;inp.tapX=e.clientX;inp.tapY=e.clientY}};
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
addEventListener('contextmenu',e=>e.preventDefault());addEventListener('gesturestart',e=>e.preventDefault());
addEventListener('keydown',e=>{keys[e.code]=true;
  if(e.code==='Space'||e.code==='KeyX'){e.preventDefault();if(state==='play')doBurst();else if(state==='title'||state==='over')start()}
  if(e.code==='Enter'&&(state==='title'||state==='over'))start();
  if(e.code==='Escape'||e.code==='KeyP'){state==='play'?pause():resume()}
  if(e.code.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=false});
$('startBtn').onclick=start;$('retryBtn').onclick=start;$('resumeBtn').onclick=resume;$('restartBtn').onclick=start;
$('pauseBtn').onclick=pause;$('burstBtn').onclick=doBurst;$('muteBtn').onclick=()=>{auInit();setMute(!AU.muted)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});

// ───────────────────────── main loop
let last=performance.now(),acc=0,frames=0,cool=4;
function frame(now){
  requestAnimationFrame(frame);
  const raw=Math.min(.05,(now-last)/1000);last=now;
  if(state==='pause'){return}
  // adaptive quality
  acc+=raw;frames++;if(acc>=2){const avg=acc/frames;acc=0;frames=0;if(cool>0)cool-=2;else if(avg>1/43&&qi>0){qi--;Q=QL[qi];resize();cool=4}}
  let ts=1;if(G.hitstop>0){G.hitstop-=raw;ts=.05}else if(G.slow>0){G.slow-=raw;ts=.35}
  const dt=raw*ts;G.time+=dt;G.scroll+=SCROLL*dt;U.uTime.value=G.time;U.uScroll.value=G.scroll;
  updateEnv(raw);
  drawClouds(dt);
  updateStage(dt);updatePlayer(dt);
  if(state==='play'||state==='dead'){updateShots(dt);updateEnemies(dt);updateBullets(dt);updateItems(dt)}
  updateFx(dt);updateCamera(dt);
  if(state==='dead'&&(G.endT-=raw)<=0)gameOver();
  if(state==='play')updateHud();
  ADD.end();ALP.end();
  G.flash=Math.max(0,G.flash-raw*1.6);G.hurtV=Math.max(0,G.hurtV-raw*1.8);
  const low=state==='play'&&P.hp<=35?.25+.12*Math.sin(G.time*6):0,hv=Math.max(G.hurtV,low);
  matOut.uniforms.hurt.value=hv;matOut.uniforms.flash.value=G.flash;matOut.uniforms.time.value=G.time;matOut.uniforms.ca.value=.004+G.shake*.012+G.flash*.03;
  $('vig').style.opacity=Q.bloom?0:hv;
  if(AU.eng)AU.eng.gain.value=state==='play'&&!AU.muted?.16:0;
  renderFrame();
}

// boot
setEnv(0);
for(let i=0;i<110;i++){const c={};seedCloud(c,false);clouds.push(c)}
$('bestT').textContent=(+store.get('soukyu_best','0')).toLocaleString('en-US');
setMute(AU.muted);resize();
// debug hooks: ?stage=N jumps ahead, ?boss skips to the boss
const qs=new URLSearchParams(location.search);
if(qs.has('stage')||qs.has('boss'))addEventListener('pointerdown',()=>setTimeout(()=>{if(qs.has('stage')){G.stage=+qs.get('stage')||0;beginStage()}if(qs.has('boss'))G.t=999},50),{once:true});
requestAnimationFrame(frame);
</script>
