<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIの犬のアプリ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root{--bg:#f3f1ec;--card:#fff;--fg:#1d1b26;--muted:#6b6878;--line:#dedad0}
@media (prefers-color-scheme:dark){:root{--bg:#16151d;--card:#211f2b;--fg:#f1eee6;--muted:#a19dae;--line:#33303f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif}
main{max-width:560px;margin:0 auto;padding:48px 16px}
h1{font-weight:800;font-size:26px;margin:0 0 6px}
p.lead{color:var(--muted);margin:0 0 28px}
a.card{display:flex;gap:16px;align-items:center;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px;transition:transform .15s}
a.card:hover{transform:translateY(-2px)}
.icon{flex:none;width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:28px}
.g{background:#1b1a2e}.k{background:#e2552c}
.t1{background:#071a2c}.t2{background:#0f2b45}.t3{background:#2a2516}.t4{background:#3a1d63}.t5{background:#3a2c12}
h3.sec{font-size:15px;color:var(--muted);margin:32px 0 12px;font-weight:800;letter-spacing:.04em}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:2px}
h2{font-size:18px;margin:0 0 2px;font-weight:800}
.card p{margin:0;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
<h1>AIの犬のアプリ</h1>
<p class="lead">遊べるもの・使えるもの</p>
<a class="card" href="/otsukare.html">
  <div class="icon g">🍡</div>
  <div><h2>おつかれドロップ</h2><p>同じおやつをくっつけてケーキを目指すパズル</p></div>
</a>
<a class="card" href="/koepad.html">
  <div class="icon k">🗣️</div>
  <div><h2>コエパッド</h2><p>入力した文字を声で読み上げる会話アシスト</p></div>
</a>
<h3 class="sec">🎮 ふたりで遊ぶ（1台のキーボードで対戦・協力）</h3>
<a class="card" href="/tron.html">
  <div class="icon t1">⚡</div>
  <div><h2>ネオンライダー<span class="tag">対戦</span></h2><p>光の線で相手を囲い込むトロン風バトル</p></div>
</a>
<a class="card" href="/hockey.html">
  <div class="icon t2">🏒</div>
  <div><h2>スマッシュホッケー<span class="tag">対戦</span></h2><p>ダッシュで打ち込むネオンのエアホッケー</p></div>
</a>
<a class="card" href="/tanks.html">
  <div class="icon t3">💥</div>
  <div><h2>バウンスタンク<span class="tag">対戦</span></h2><p>壁で跳ね返る弾で撃ち合う戦車バトル</p></div>
</a>
<a class="card" href="/party.html">
  <div class="icon t4">🎉</div>
  <div><h2>はやおしパーティー<span class="tag">対戦</span></h2><p>早撃ち・連打・色あてなど5つのミニゲーム</p></div>
</a>
<a class="card" href="/coop.html">
  <div class="icon t5">🔥</div>
  <div><h2>ほのおとしずくの神殿<span class="tag">協力</span></h2><p>ふたりで力を合わせて解くパズルアクション</p></div>
</a>
</main>
</body>
</html>
