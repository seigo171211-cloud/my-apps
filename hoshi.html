<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ほしわたり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* One-finger swing game: hold to catch the nearest star, release to fly. Climb before the dawn arrives. */
:root {
  --night: #070b1f;
  --ink: #f4f1ff;
  --muted: #a9a8cf;
  --gold: #ffd98a;
  --dawn: #ffb48a;
  --font-display: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif;
  --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--ink);
  font-family: var(--font-body); font-weight: 500;
  overflow: hidden; overscroll-behavior: none; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hud {
  position: fixed; inset: 0 0 auto 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start;
  padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left));
  pointer-events: none;
}
.hud > * { pointer-events: auto; }
.back {
  justify-self: start; color: var(--muted); text-decoration: none; font-size: .8rem;
  padding: 8px 12px; margin: -2px 0 0 -6px; border-radius: 999px; background: rgba(10,14,40,.35);
}
.back:hover { color: var(--ink); }
.score { text-align: center; pointer-events: none; text-shadow: 0 2px 14px rgba(5,8,30,.8); }
.score b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: .7rem; color: var(--muted); letter-spacing: .08em; }
#muteBtn {
  justify-self: end; width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer;
  background: rgba(10,14,40,.35); color: var(--ink); font-size: 1.1rem; font-family: inherit; margin-right: -4px;
}
#muteBtn.off { color: var(--muted); text-decoration: line-through; }
.back:focus-visible, #muteBtn:focus-visible, .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.title {
  position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  padding: 19vh 24px 0; text-align: center; pointer-events: none; transition: opacity .5s;
}
.title.gone { opacity: 0; }
.title h1 {
  font-family: var(--font-display); font-weight: 800; font-size: clamp(2.6rem, 12vw, 4.2rem); margin: 0; letter-spacing: .06em;
  text-shadow: 0 0 34px rgba(170,180,255,.55);
}
.title p { margin: 10px 0 0; color: var(--muted); font-size: .95rem; line-height: 1.8; }
.hint {
  position: fixed; left: 0; right: 0; bottom: max(9vh, calc(env(safe-area-inset-bottom) + 28px));
  text-align: center; pointer-events: none; font-size: .95rem; line-height: 1.9; transition: opacity .4s;
  text-shadow: 0 2px 12px rgba(5,8,30,.9);
}
.hint.gone { opacity: 0; }
.hint b { font-family: var(--font-display); font-weight: 800; color: var(--gold); }

.overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; animation: fade .7s both; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } }
.card {
  width: min(360px, 100%); padding: 22px 22px 20px; border-radius: 22px; text-align: center;
  background: rgba(16,18,48,.82); border: 1px solid rgba(255,255,255,.14);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  box-shadow: 0 20px 60px rgba(20,10,40,.45);
}
.card .kicker { margin: 0; font-size: .78rem; letter-spacing: .2em; color: var(--dawn); }
.card h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.55rem; margin: 6px 0 2px; }
.card .sub { margin: 0; font-size: .75rem; color: var(--muted); letter-spacing: .14em; }
#sky { display: block; width: 100%; height: 190px; margin: 10px 0 8px; border-radius: 14px; background: linear-gradient(#0a0f2c, #1b1d4e); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 0 12px; }
.stats div { font-size: .68rem; color: var(--muted); letter-spacing: .08em; }
.stats b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.total { font-family: var(--font-display); font-weight: 800; font-size: 2.5rem; line-height: 1; font-variant-numeric: tabular-nums; }
.total small { font-size: .9rem; margin-left: 4px; color: var(--muted); }
.bestline { margin: 6px 0 16px; font-size: .8rem; color: var(--muted); min-height: 1.3em; }
.bestline.new { color: var(--gold); }
.btns { display: flex; gap: 10px; }
.btn {
  flex: 1; display: inline-flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 999px;
  font-family: var(--font-display); font-weight: 800; font-size: 1rem; text-decoration: none; cursor: pointer; border: 0;
}
.btn.primary { background: var(--gold); color: #2a1c3c; flex: 1.5; }
.btn.ghost { background: rgba(255,255,255,.1); color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .overlay { animation: none; } }
</style>
</head>
<body>
<canvas id="game" aria-label="ほしわたり ゲーム画面"></canvas>

<div class="hud">
  <a class="back" href="/">← アプリ一覧</a>
  <div class="score"><b id="score">0</b><small>ベスト <span id="best">0</span></small></div>
  <button id="muteBtn" type="button" aria-label="音のオン・オフ">♪</button>
</div>

<div class="title" id="title">
  <h1>ほしわたり</h1>
  <p>夜明けに追いつかれる前に<br>星から星へ、高くのぼろう</p>
</div>
<div class="hint" id="hint"><b>おさえる</b> … ちかくの星につかまる<br><b>はなす</b> … とびだす</div>

<div class="overlay" id="result" hidden>
  <div class="card">
    <p class="kicker">朝になりました</p>
    <h2 id="conName">こいぬ座</h2>
    <p class="sub">今夜あなたがつないだ星座</p>
    <canvas id="sky"></canvas>
    <div class="stats">
      <div><b id="rHeight">0</b>たかさ</div>
      <div><b id="rStars">0</b>つないだ星</div>
      <div><b id="rDust">0</b>ほしくず</div>
    </div>
    <div class="total"><span id="rTotal">0</span><small>てん</small></div>
    <p class="bestline" id="rBest"></p>
    <div class="btns">
      <button class="btn primary" id="retryBtn" type="button">もういちど</button>
      <a class="btn ghost" href="/">アプリ一覧</a>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const mod = (a, n) => ((a % n) + n) % n;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- view ---------- */
let cw = 0, ch = 0, dpr = 1, sc = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cw = window.innerWidth; ch = window.innerHeight;
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  sc = Math.min(cw / 600, ch / 950);
}
addEventListener('resize', resize); resize();
const cam = { x: 0, y: 0 };
const SX = x => (x - cam.x) * sc + cw / 2;
const SY = y => ch * 0.58 - (y - cam.y) * sc;

/* ---------- world (infinite, generated per cell from a seed) ---------- */
const CELL = 180, RANGE = 235, MIN_R = 30;
let seed = 1;
function hash(a, b, c) {
  let h = Math.imul(a, 374761393) ^ Math.imul(b, 668265263) ^ Math.imul(c + seed, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1103515245); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
const TINTS = ['#ffffff', '#cfe0ff', '#fff1c9', '#ffd6e8'];
let cells = new Map();
function getCell(cx, cy) {
  const key = cx + ',' + cy;
  let c = cells.get(key);
  if (c) return c;
  c = { star: null, dust: [] };
  const origin = cx === 0 && cy === 0;
  const density = cy <= 1 ? 1 : Math.max(0.56, 0.92 - cy * 0.006);
  if (origin || hash(cx, cy, 1) < density) {
    const s = c.star = {
      x: origin ? 0 : cx * CELL + (hash(cx, cy, 2) - .5) * 104,
      y: origin ? 0 : cy * CELL + (hash(cx, cy, 3) - .5) * 104,
      size: .75 + hash(cx, cy, 4) * .6, tint: Math.floor(hash(cx, cy, 5) * 4),
      note: Math.floor(hash(cx, cy, 6) * 10), ph: hash(cx, cy, 7) * TAU, lit: false, litT: 0,
    };
    if (!origin && hash(cx, cy, 8) < .38) {
      const n = 6, r = 58 + hash(cx, cy, 9) * 34, a0 = hash(cx, cy, 10) * TAU;
      for (let i = 0; i < n; i++) c.dust.push({ x: s.x + Math.cos(a0 + i / n * TAU) * r, y: s.y + Math.sin(a0 + i / n * TAU) * r, got: false, ph: i });
    }
  } else {
    const a = hash(cx, cy, 11) * TAU, bx = cx * CELL, by = cy * CELL;
    for (let i = -1; i <= 1; i++) c.dust.push({ x: bx + Math.cos(a) * i * 34, y: by + Math.sin(a) * i * 34, got: false, ph: i });
  }
  cells.set(key, c);
  return c;
}
function eachCellNear(x, y, rad, fn) {
  const x0 = Math.floor((x - rad) / CELL + .5), x1 = Math.floor((x + rad) / CELL + .5);
  const y0 = Math.floor((y - rad) / CELL + .5), y1 = Math.floor((y + rad) / CELL + .5);
  for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) fn(getCell(cx, cy));
}

/* ---------- audio: every star has a note, so the constellation is also a melody ---------- */
let ac = null, master = null, wet = null, muted = false;
try { muted = localStorage.getItem('hoshi-muted') === '1'; } catch (e) {}
const PENT = [0, 2, 4, 7, 9];
const noteHz = i => 293.66 * Math.pow(2, (PENT[i % 5] + 12 * Math.floor(i / 5)) / 12);
function unlock() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = muted ? 0 : 1;
    const comp = ac.createDynamicsCompressor();
    master.connect(comp); comp.connect(ac.destination);
    wet = ac.createDelay(1); wet.delayTime.value = .36;
    const fb = ac.createGain(); fb.gain.value = .38;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
    wet.connect(lp); lp.connect(fb); fb.connect(wet); lp.connect(master);
    // soft drone
    const pad = ac.createGain(); pad.gain.value = 0;
    pad.gain.linearRampToValueAtTime(.05, ac.currentTime + 4);
    const pf = ac.createBiquadFilter(); pf.type = 'lowpass'; pf.frequency.value = 520;
    const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = .07; lg.gain.value = 260;
    lfo.connect(lg); lg.connect(pf.frequency); lfo.start();
    pad.connect(pf); pf.connect(master);
    [73.42, 110, 146.83, 185, 220.4].forEach((f, i) => {
      const o = ac.createOscillator(); o.type = i < 2 ? 'sine' : 'triangle'; o.frequency.value = f; o.detune.value = (i - 2) * 4;
      const g = ac.createGain(); g.gain.value = i < 2 ? 1 : .35; o.connect(g); g.connect(pad); o.start();
    });
  }
  if (ac.state === 'suspended') ac.resume();
}
function tone(f, dur, gain, type, when, send) {
  if (!ac || muted) return;
  const t = ac.currentTime + (when || 0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + .008);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(master);
  if (send) { const s = ac.createGain(); s.gain.value = send; g.connect(s); s.connect(wet); }
  o.start(t); o.stop(t + dur + .05);
}
const bell = (i, when, vol) => { const f = noteHz(i); tone(f, 1.5, .16 * (vol || 1), 'sine', when, .5); tone(f * 2.005, .6, .045 * (vol || 1), 'sine', when, .3); tone(f * 3.01, .25, .02 * (vol || 1), 'sine', when); };
const pluck = (i, when) => tone(noteHz(i), .28, .09, 'triangle', when, .35);
function paintMute() { $('muteBtn').classList.toggle('off', muted); }
$('muteBtn').onclick = e => {
  unlock(); muted = !muted;
  try { localStorage.setItem('hoshi-muted', muted ? '1' : '0'); } catch (err) {}
  if (master) master.gain.setTargetAtTime(muted ? 0 : 1, ac.currentTime, .05);
  paintMute(); e.currentTarget.blur();
};
paintMute();
document.addEventListener('visibilitychange', () => { if (ac) document.hidden ? ac.suspend() : ac.resume(); });

/* ---------- state ---------- */
let mode = 'ready';           // ready (orbiting the first star) → play → ending → over
let held = false, pressed = false;
let p, tether, lit, trail, parts, floats, comet, cometT;
let flyT = 0, dawnY, playT, time = 0, maxH, bonus, dustN, combo, comboT, chain, endT, shake, overAt = 0;
let best = 0;
try { best = +localStorage.getItem('hoshi-best') || 0; } catch (e) {}
$('best').textContent = best;

function reset() {
  seed = (Math.random() * 2147483647) | 0;
  cells = new Map();
  const s0 = getCell(0, 0).star;
  s0.lit = true; s0.litT = 1;
  lit = [s0];
  p = { x: 0, y: -72, dx: 1, dy: 0 };
  tether = { s: s0, r: 72, ang: -Math.PI / 2, sign: 1, acc: 0, laps: 0 };
  trail = []; parts = []; floats = []; comet = null; cometT = 9;
  dawnY = -560; playT = 0; maxH = 0; bonus = 0; dustN = 0; combo = 0; comboT = 0; chain = 0; endT = 0; shake = 0;
  cam.x = 0; cam.y = 60;
  mode = 'ready'; pressed = false; held = false; flyT = 0;
  $('score').textContent = '0';
  $('result').hidden = true;
  $('score').parentElement.style.visibility = '';
  $('hint').classList.remove('gone');
}
const baseSpeed = () => Math.min(410, 265 + playT * .5);
// Momentum fades while flying free; catching a star recharges it. So you cannot just fly straight up forever.
const glide = () => tether || mode === 'ready' ? 1 : Math.max(.2, 1.18 - .6 * flyT);
const speed = () => baseSpeed() * glide();
const heightPts = () => Math.floor(maxH / 10);

function burst(x, y, n, color, pow) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, v = (.3 + Math.random()) * pow;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: .5 + Math.random() * .6, color, size: 1 + Math.random() * 2 });
  }
}
function float(x, y, text, color) { floats.push({ x, y, text, color: color || '#fff', life: 0 }); }

function candidate() {
  let bestS = null, bd = RANGE;
  eachCellNear(p.x, p.y, RANGE, c => {
    const s = c.star; if (!s || s.y < dawnY) return;
    const d = Math.hypot(s.x - p.x, s.y - p.y);
    if (d < bd) { bd = d; bestS = s; }
  });
  return bestS;
}
function grab(s) {
  const rx = p.x - s.x, ry = p.y - s.y;
  const r = Math.max(MIN_R, Math.hypot(rx, ry));
  tether = { s, r, ang: Math.atan2(ry, rx), sign: (rx * p.dy - ry * p.dx) >= 0 ? 1 : -1, acc: 0, laps: 0 };
  if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
  if (!s.lit) {
    s.lit = true; lit.push(s); chain++;
    const pts = 10 + 10 * Math.min(chain, 8);
    bonus += pts; float(s.x, s.y + 26, '+' + pts, TINTS[s.tint]);
    burst(s.x, s.y, 14, TINTS[s.tint], 120);
    bell(s.note);
  } else { chain = 0; bell(s.note, 0, .45); }
}
function release() { tether = null; flyT = 0; }

function endGame() {
  mode = 'ending'; endT = 0; tether = null; held = false;
  [0, 2, 4, 7].forEach((n, i) => bell(n, i * .22, .8));
}
function showResult() {
  mode = 'over'; overAt = performance.now();
  const total = heightPts() + bonus;
  const isBest = total > best;
  if (isBest) { best = total; try { localStorage.setItem('hoshi-best', best); } catch (e) {} $('best').textContent = best; }
  $('rHeight').textContent = heightPts();
  $('rStars').textContent = lit.length;
  $('rDust').textContent = dustN;
  $('rTotal').textContent = total;
  $('rBest').textContent = isBest ? '★ ベスト更新！' : 'ベスト ' + best;
  $('rBest').classList.toggle('new', isBest);
  $('conName').textContent = constellationName();
  $('result').hidden = false;
  $('score').parentElement.style.visibility = 'hidden';
  $('hint').classList.add('gone');
  playConstellation();
  $('retryBtn').focus({ preventScroll: true });
}

/* ---------- result: your constellation, drawn star by star with its melody ---------- */
function constellationName() {
  if (lit.length < 3) return 'まだ名もない星';
  const A = ['ねむたい', 'はらぺこ', 'おさんぽ', 'ごきげん', 'うたたね', 'まよいご', 'よふかし', 'のんびり', 'くいしんぼ', 'あまえんぼ', 'はしゃぎ', 'おるすばん'];
  const N = ['こいぬ', 'しっぽ', 'にくきゅう', 'ほねっこ', 'おやつ', 'ボール', 'おひるね', 'くびわ', 'はなさき', 'おみみ', 'あしあと', 'おすわり'];
  let h = lit.length * 31;
  for (const s of lit.slice(-16)) h = (h * 33 + Math.round(s.x) * 7 + Math.round(s.y)) | 0;
  h = Math.abs(h);
  return A[h % A.length] + N[Math.floor(h / A.length) % N.length] + '座';
}
let conAnim = null;
function playConstellation() {
  const sky = $('sky'), g = sky.getContext('2d');
  const w = sky.clientWidth, h = sky.clientHeight;
  sky.width = w * dpr; sky.height = h * dpr;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  const shown = lit.slice(-16);
  for (const s of shown) { x0 = Math.min(x0, s.x); x1 = Math.max(x1, s.x); y0 = Math.min(y0, s.y); y1 = Math.max(y1, s.y); }
  const turn = (y1 - y0) > (x1 - x0);   // lay a tall climb on its side to fit the wide card
  if (turn) { [x0, y0] = [y0, x0]; [x1, y1] = [y1, x1]; }
  const pad = 26, k = Math.min((w - pad * 2) / Math.max(x1 - x0, 60), (h - pad * 2) / Math.max(y1 - y0, 60));
  const pts = shown.map(s => { const a = turn ? s.y : s.x, b = turn ? s.x : s.y; return { x: w / 2 + (a - (x0 + x1) / 2) * k, y: h / 2 - (b - (y0 + y1) / 2) * k, s }; });
  const step = Math.max(.07, Math.min(.2, 3.6 / pts.length));
  pts.forEach((q, i) => bell(q.s.note, .5 + i * step, .7));
  const t0 = performance.now();
  cancelAnimationFrame(conAnim);
  (function frame() {
    const t = (performance.now() - t0) / 1000 - .5;
    const prog = reduceMotion ? pts.length : clamp(t / step, 0, pts.length);
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
    for (let i = 0; i < 40; i++) { g.fillStyle = 'rgba(255,255,255,' + (.12 + hash(i, 3, 99) * .3) + ')'; g.fillRect(hash(i, 1, 99) * w, hash(i, 2, 99) * h, 1.2, 1.2); }
    g.lineWidth = 1.4; g.strokeStyle = 'rgba(200,215,255,.7)'; g.lineCap = 'round';
    g.beginPath();
    for (let i = 0; i < pts.length - 1 && i < prog; i++) {
      const f = clamp(prog - i, 0, 1), a = pts[i], b = pts[i + 1];
      g.moveTo(a.x, a.y); g.lineTo(lerp(a.x, b.x, f), lerp(a.y, b.y, f));
    }
    g.stroke();
    pts.forEach((q, i) => {
      if (i > prog) return;
      const pop = clamp(1.8 - (prog - i) * .8, 1, 1.8), r = 2.6 * q.s.size * pop;
      g.fillStyle = TINTS[q.s.tint]; g.shadowColor = TINTS[q.s.tint]; g.shadowBlur = 8;
      g.beginPath(); g.arc(q.x, q.y, r, 0, TAU); g.fill();
    });
    g.shadowBlur = 0;
    if (mode === 'over' && prog < pts.length) conAnim = requestAnimationFrame(frame);
  })();
}

/* ---------- input: one finger, anywhere ---------- */
function down() {
  if (mode === 'over') return;
  unlock(); held = true;
  if (mode === 'ready') { pressed = true; $('title').classList.add('gone'); }
}
function up() {
  if (!held) return;
  held = false;
  if (mode === 'ready' && pressed) { mode = 'play'; release(); $('hint').classList.add('gone'); }
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); down(); });
addEventListener('pointerup', up);
addEventListener('pointercancel', up);
addEventListener('blur', up);
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  if (e.target instanceof HTMLButtonElement || e.target instanceof HTMLAnchorElement) return;
  e.preventDefault(); if (!e.repeat) down();
});
addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter') up(); });
$('retryBtn').onclick = () => { if (performance.now() - overAt > 500) { unlock(); reset(); } };

/* ---------- update ---------- */
function update(dt) {
  time += dt;
  if (mode === 'ending') { endT += dt; if (endT > 1.5) showResult(); dt *= .25; }
  if (mode === 'over') dt *= .15;
  if (mode === 'play') playT += dt;
  const v = speed();

  if (mode === 'play') {
    if (held && !tether) { const s = candidate(); if (s) grab(s); }
    else if (!held && tether) release();
  }
  if (tether) {
    const da = v / tether.r * dt;
    tether.ang += tether.sign * da;
    p.x = tether.s.x + Math.cos(tether.ang) * tether.r;
    p.y = tether.s.y + Math.sin(tether.ang) * tether.r;
    p.dx = -Math.sin(tether.ang) * tether.sign; p.dy = Math.cos(tether.ang) * tether.sign;
    if (mode === 'play') {
      tether.acc += da;
      if (tether.acc >= TAU * (tether.laps + 1)) {
        tether.laps++; bonus += 30;
        float(tether.s.x, tether.s.y + 30, 'ひとまわり +30', '#ffd98a');
        burst(tether.s.x, tether.s.y, 18, '#ffd98a', 150);
        pluck(5); pluck(7, .07); pluck(9, .14);
      }
    }
  } else if (mode !== 'over') {
    flyT += dt;
    p.x += p.dx * v * dt; p.y += p.dy * v * dt;
  }
  trail.push(p.x, p.y); if (trail.length > 56) trail.splice(0, 2);

  if (mode === 'play') {
    // stardust
    comboT -= dt; if (comboT <= 0) combo = 0;
    eachCellNear(p.x, p.y, 40, c => {
      for (const d of c.dust) {
        if (d.got || Math.hypot(d.x - p.x, d.y - p.y) > 27) continue;
        d.got = true; dustN++; bonus += 5; combo = Math.min(combo + 1, 10); comboT = 1.3;
        burst(d.x, d.y, 5, '#ffe9a8', 70); pluck(4 + combo);
      }
    });
    // a shooting star drifts by now and then: catching it holds the dawn back
    cometT -= dt;
    if (!comet && cometT <= 0) {
      const side = Math.random() < .5 ? -1 : 1, half = cw / 2 / sc + 60;
      comet = { x: p.x + side * half, y: p.y + 280 + Math.random() * 260, vx: -side * (120 + Math.random() * 50), vy: -28, life: 0 };
    }
    if (comet) {
      comet.x += comet.vx * dt; comet.y += comet.vy * dt; comet.life += dt;
      if (Math.random() < .6) parts.push({ x: comet.x, y: comet.y, vx: -comet.vx * .2 + (Math.random() - .5) * 30, vy: (Math.random() - .5) * 30, life: 0, max: .7, color: '#ffd98a', size: 1.6 });
      if (Math.hypot(comet.x - p.x, comet.y - p.y) < 42) {
        bonus += 100; dawnY -= 320; shake = .25;
        float(comet.x, comet.y + 30, 'ながれ星！ +100', '#ffd98a');
        burst(comet.x, comet.y, 40, '#ffd98a', 260);
        [5, 7, 9, 10, 12].forEach((n, i) => pluck(n, i * .06));
        comet = null; cometT = 11 + Math.random() * 6;
      } else if (comet.life > 11 || comet.y < dawnY) { comet = null; cometT = 8 + Math.random() * 6; }
    }
    // the dawn
    dawnY += Math.min(360, 50 + playT * 1.5) * dt;
    dawnY = Math.max(dawnY, p.y - 980);
    maxH = Math.max(maxH, p.y);
    if (p.y < dawnY + 6) endGame();
    $('score').textContent = heightPts() + bonus;
  } else if (mode === 'ending' || mode === 'over') {
    dawnY += (mode === 'over' ? 900 : 2100) * dt;
  }

  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i]; q.life += dt;
    if (q.life > q.max) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
    q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 1 - 2.2 * dt; q.vy *= 1 - 2.2 * dt;
  }
  for (let i = floats.length - 1; i >= 0; i--) { floats[i].life += dt; if (floats[i].life > 1.2) floats.splice(i, 1); }
  for (const s of lit) if (s.litT < 1) s.litT = Math.min(1, s.litT + dt * 3);
  shake = Math.max(0, shake - dt);

  // camera leans toward the star you are swinging on, so orbits don't rock the whole screen
  let tx = p.x, ty = p.y;
  if (tether) { tx = lerp(p.x, tether.s.x, .65); ty = lerp(p.y, tether.s.y, .65) + 50; }
  else { tx += p.dx * 40; ty += p.dy * 40 + 30; }
  const k = 1 - Math.exp(-4.5 * dt / (mode === 'ending' ? .25 : mode === 'over' ? .15 : 1));
  cam.x = lerp(cam.x, tx, k); cam.y = lerp(cam.y, ty, k);

  if (cells.size > 1400) { const cut = Math.floor((dawnY - 1400) / CELL); for (const key of cells.keys()) if (+key.split(',')[1] < cut) cells.delete(key); }
}

/* ---------- render ---------- */
function glowSprite(color) {
  const c = document.createElement('canvas'); c.width = c.height = 96;
  const g = c.getContext('2d'), gr = g.createRadialGradient(48, 48, 0, 48, 48, 48);
  gr.addColorStop(0, color); gr.addColorStop(.12, color);
  gr.addColorStop(.3, color + '55'); gr.addColorStop(.6, color + '14'); gr.addColorStop(1, color + '00');
  g.fillStyle = gr; g.fillRect(0, 0, 96, 96);
  return c;
}
const starGlow = TINTS.map(glowSprite), goldGlow = glowSprite('#ffd98a'), dawnGlow = glowSprite('#ffc7a0');
const mix = (a, b, t) => 'rgb(' + a.map((v, i) => Math.round(lerp(v, b[i], t))).join(',') + ')';
function glow(img, x, y, r, alpha) { ctx.globalAlpha = alpha; ctx.drawImage(img, x - r, y - r, r * 2, r * 2); }

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const gap = p.y - dawnY;
  const warm = mode === 'play' || mode === 'ready' ? clamp(1 - gap / 620, 0, 1) * .85 : 1;
  const flash = mode === 'ending' ? clamp(endT / 1.2, 0, 1) : mode === 'over' ? 1 : 0;

  // sky
  let g = ctx.createLinearGradient(0, 0, 0, ch);
  g.addColorStop(0, mix([5, 8, 28], [38, 34, 92], warm));
  g.addColorStop(.6, mix([14, 20, 58], [92, 58, 122], warm));
  g.addColorStop(1, mix([30, 26, 82], [186, 104, 128], warm));
  ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fillRect(0, 0, cw, ch);

  if (shake > 0 && !reduceMotion) ctx.translate((Math.random() - .5) * shake * 20, (Math.random() - .5) * shake * 20);

  // far stars (two parallax layers)
  const n = Math.min(240, Math.round(cw * ch / 7000));
  ctx.fillStyle = '#fff';
  for (let i = 0; i < n; i++) {
    const f = i % 3 === 0 ? .32 : .14, W = cw + 20, H = ch + 20;
    const x = mod(hash(i, 1, 77 - seed) * W - cam.x * sc * f, W) - 10;
    const y = mod(hash(i, 2, 77 - seed) * H + cam.y * sc * f, H) - 10;
    const tw = .35 + .3 * Math.sin(time * (1 + (i % 5) * .4) + i);
    ctx.globalAlpha = (f > .2 ? tw + .25 : tw) * (1 - flash * .8) * (1 - warm * clamp(y / ch, 0, 1) * .8);
    const s = f > .2 ? 1.7 : 1.1; ctx.fillRect(x, y, s, s);
  }

  // dawn
  const dy = SY(dawnY), band = 540 * sc;
  if (dy - band < ch) {
    g = ctx.createLinearGradient(0, dy - band, 0, dy);
    g.addColorStop(0, 'rgba(255,150,130,0)'); g.addColorStop(.55, 'rgba(255,140,130,.32)');
    g.addColorStop(.88, 'rgba(255,186,140,.85)'); g.addColorStop(1, 'rgba(255,226,180,1)');
    ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fillRect(-20, dy - band, cw + 40, band + 1);
    if (dy < ch + 20) {
      g = ctx.createLinearGradient(0, dy, 0, dy + 700 * sc);
      g.addColorStop(0, '#ffe2b4'); g.addColorStop(.4, '#ffeed8'); g.addColorStop(1, '#cfe6ff');
      ctx.fillStyle = g; ctx.fillRect(-20, dy, cw + 40, ch - dy + 40);
    }
    ctx.globalCompositeOperation = 'lighter';
    glow(dawnGlow, cw / 2, dy + 40 * sc, 560 * sc, .5);
    ctx.globalCompositeOperation = 'source-over';
  }
  const fadeAt = y => clamp((y - dawnY) / 320, 0, 1);

  // constellation lines
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round'; ctx.lineWidth = Math.max(1, 1.6 * sc);
  for (let i = 1; i < lit.length; i++) {
    const a = lit[i - 1], b = lit[i];
    const ay = SY(a.y), by = SY(b.y);
    if ((ay < -50 && by < -50) || (ay > ch + 50 && by > ch + 50)) continue;
    const f = b.litT;
    ctx.globalAlpha = .5 * Math.min(fadeAt(a.y), fadeAt(b.y));
    ctx.strokeStyle = '#b9c8ff';
    ctx.beginPath(); ctx.moveTo(SX(a.x), ay); ctx.lineTo(SX(lerp(a.x, b.x, f)), SY(lerp(a.y, b.y, f))); ctx.stroke();
  }

  // stars and stardust
  const halfW = cw / 2 / sc + 80, cand = (mode === 'play' && !tether) ? candidate() : null;
  const cx0 = Math.floor((cam.x - halfW) / CELL + .5), cx1 = Math.floor((cam.x + halfW) / CELL + .5);
  const cy0 = Math.floor((cam.y - ch * .42 / sc - 80) / CELL + .5), cy1 = Math.floor((cam.y + ch * .58 / sc + 80) / CELL + .5);
  for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
    const c = getCell(cx, cy);
    for (const d of c.dust) {
      if (d.got) continue;
      const a = fadeAt(d.y); if (a <= 0) continue;
      const tw = .75 + .25 * Math.sin(time * 4 + d.ph * 1.7 + cx);
      glow(goldGlow, SX(d.x), SY(d.y), 11 * sc * tw, a * .95);
    }
    const s = c.star; if (!s) continue;
    const a = fadeAt(s.y); if (a <= 0) continue;
    const x = SX(s.x), y = SY(s.y), tw = .85 + .15 * Math.sin(time * 2 + s.ph);
    const r = (s.lit ? 46 + 22 * (1 - s.litT) : 30) * s.size * sc * tw;
    glow(starGlow[s.tint], x, y, r, a * (s.lit ? 1 : .8));
    if (s.lit) { // four-point sparkle
      ctx.globalAlpha = a * .7; ctx.strokeStyle = TINTS[s.tint]; ctx.lineWidth = Math.max(1, 1.2 * sc);
      const L = 17 * s.size * sc * tw;
      ctx.beginPath(); ctx.moveTo(x - L, y); ctx.lineTo(x + L, y); ctx.moveTo(x, y - L); ctx.lineTo(x, y + L); ctx.stroke();
    }
  }

  // guides: which star you would catch / where you would fly
  const px = SX(p.x), py = SY(p.y);
  if (cand) {
    const x = SX(cand.x), y = SY(cand.y), pulse = 1 + .08 * Math.sin(time * 7);
    ctx.globalAlpha = .75; ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(1, 1.5 * sc);
    ctx.beginPath(); ctx.arc(x, y, 21 * sc * pulse, 0, TAU); ctx.stroke();
    ctx.globalAlpha = .22; ctx.setLineDash([3 * sc, 7 * sc]);
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y); ctx.stroke(); ctx.setLineDash([]);
  }
  if (tether && mode !== 'over') {
    const x = SX(tether.s.x), y = SY(tether.s.y);
    ctx.globalAlpha = .7; ctx.strokeStyle = '#dfe6ff'; ctx.lineWidth = Math.max(1, 1.4 * sc);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(px, py); ctx.stroke();
    ctx.globalAlpha = .1; ctx.beginPath(); ctx.arc(x, y, tether.r * sc, 0, TAU); ctx.stroke();
    ctx.fillStyle = '#fff';
    for (let i = 1; i <= 9; i++) {
      const d = (i * 30 - mod(time * 60, 30)) * sc;
      ctx.globalAlpha = .55 * (1 - i / 10);
      ctx.beginPath(); ctx.arc(px + p.dx * d, py - p.dy * d, 2 * sc, 0, TAU); ctx.fill();
    }
  }

  // shooting star
  if (comet) {
    const x = SX(comet.x), y = SY(comet.y);
    g = ctx.createLinearGradient(x, y, x - comet.vx * .9 * sc, y + comet.vy * .9 * sc);
    g.addColorStop(0, 'rgba(255,225,150,.9)'); g.addColorStop(1, 'rgba(255,225,150,0)');
    ctx.globalAlpha = 1; ctx.strokeStyle = g; ctx.lineWidth = 4 * sc;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - comet.vx * .9 * sc, y + comet.vy * .9 * sc); ctx.stroke();
    glow(goldGlow, x, y, 34 * sc, 1);
  }

  // trail
  for (let i = 2; i < trail.length; i += 2) {
    const f = i / trail.length;
    ctx.globalAlpha = f * .55 * (.35 + .65 * glide()); ctx.strokeStyle = '#cdd8ff'; ctx.lineWidth = Math.max(1, f * 9 * sc);
    ctx.beginPath(); ctx.moveTo(SX(trail[i - 2]), SY(trail[i - 1])); ctx.lineTo(SX(trail[i]), SY(trail[i + 1])); ctx.stroke();
  }
  // particles
  for (const q of parts) {
    ctx.globalAlpha = 1 - q.life / q.max; ctx.fillStyle = q.color;
    const s = q.size * sc * 1.4; ctx.fillRect(SX(q.x) - s / 2, SY(q.y) - s / 2, s, s);
  }
  ctx.globalCompositeOperation = 'source-over';

  // the little star-dog
  if (mode !== 'over') {
    const R = 9.5 * sc;
    ctx.globalCompositeOperation = 'lighter'; glow(starGlow[0], px, py, (26 + 22 * glide()) * sc, .25 + .4 * glide()); ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(px, py, R, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffe1b0';
    for (const sgn of [-1, 1]) { // floppy ears
      ctx.beginPath(); ctx.ellipse(px + sgn * R * .92, py - R * .25, R * .42, R * .72, sgn * .35, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = '#2a2448';
    ctx.beginPath(); ctx.arc(px - R * .36, py - R * .08, R * .14, 0, TAU); ctx.arc(px + R * .36, py - R * .08, R * .14, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(px, py + R * .32, R * .17, R * .12, 0, 0, TAU); ctx.fill();
  }

  // floating score text
  ctx.textAlign = 'center';
  ctx.font = '800 ' + Math.max(13, 17 * sc) + 'px "M PLUS Rounded 1c", sans-serif';
  for (const f of floats) {
    ctx.globalAlpha = clamp(1.2 - f.life, 0, 1); ctx.fillStyle = f.color;
    ctx.shadowColor = 'rgba(5,8,30,.8)'; ctx.shadowBlur = 8;
    ctx.fillText(f.text, SX(f.x), SY(f.y) - f.life * 34 * sc);
  }
  ctx.shadowBlur = 0;

  if (flash > 0 && mode === 'ending') { ctx.globalAlpha = flash * .5; ctx.fillStyle = '#fff3dc'; ctx.fillRect(-20, -20, cw + 40, ch + 40); }
  ctx.globalAlpha = 1;
}

/* ---------- loop ---------- */
let last = 0;
function frame(now) {
  const dt = Math.min((now - last) / 1000 || 0, 1 / 20); last = now;
  const steps = dt > 1 / 45 ? 2 : 1;
  for (let i = 0; i < steps; i++) update(dt / steps);
  render();
  requestAnimationFrame(frame);
}
reset();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
